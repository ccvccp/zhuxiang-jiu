[pytest]
# 仓库根级 pytest 配置(防"从错误目录运行"陷阱)
#
# 问题: backend/pytest.ini 含 asyncio_mode=auto, 若从仓库根目录
# 直接运行 pytest(无路径参数), rootdir 落在根目录读不到该配置,
# pytest-asyncio 回退 strict 模式 → 异步 fixture 未被 await
# (test_refund_recon 等 18 项假失败)。
#
# 本配置确保从根目录运行时行为与 backend/pytest.ini 一致:
#   - 根目录无参运行 → testpaths 指向 backend, 同套测试同配置
#   - 指定 backend 路径运行 → 仍由 backend/pytest.ini 接管(更近者优先)
#
# 注意: 两处配置需保持同步(本文件仅含影响收集与执行的必要项)。

asyncio_mode = auto
testpaths = zhuxiang-jiu/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = --tb=short --strict-markers -ra

markers =
    redis: 需 Redis 服务的集成测试(无 Redis 时自动跳过)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
