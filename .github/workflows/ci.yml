name: CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'zhuxiang-jiu/backend/**'
      - 'zhuxiang-jiu/js/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'zhuxiang-jiu/backend/**'
      - 'zhuxiang-jiu/js/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # ============================================================
  # Job 1: PowerShell Compatibility Test (Windows)
  # ============================================================
  ps-version-check:
    name: PowerShell Version Check (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run version check test
        shell: pwsh
        run: |
          .\test-version-check.ps1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps-version-check-report
          path: zhuxiang-jiu/backend/test-version-check-report.json
          retention-days: 30

  # ============================================================
  # Job 2: Python Unit Tests (Ubuntu)
  # ============================================================
  python-tests:
    name: Python Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: ps-version-check
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zhuxiang-jiu/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 必须装 requirements-dev.txt: pytest/pytest-asyncio/pytest-cov/httpx/ruff 都在此
          pip install -r requirements-dev.txt

      - name: Run ruff lint check (quality gate)
        run: ruff check .

      - name: Run pytest with coverage
        run: |
          pytest -v --cov=main --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            zhuxiang-jiu/backend/test-results.xml
            zhuxiang-jiu/backend/coverage.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: zhuxiang-jiu/backend/coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Job 3: Python Unit Tests (Windows)
  # ============================================================
  python-tests-windows:
    name: Python Unit Tests (Windows)
    runs-on: windows-latest
    needs: ps-version-check
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zhuxiang-jiu/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 必须装 requirements-dev.txt: pytest/pytest-asyncio/pytest-cov/httpx 都在此
          pip install -r requirements-dev.txt

      - name: Run pytest
        shell: pwsh
        run: |
          pytest -v --junitxml=test-results-win.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-win
          path: zhuxiang-jiu/backend/test-results-win.xml
          retention-days: 30

  # ============================================================
  # Job 4: Docker Build Test (Linux)
  # ============================================================
  docker-build-test:
    name: Docker Build Test (Linux)
    runs-on: ubuntu-latest
    needs: python-tests
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: zhuxiang-jiu/backend
          file: zhuxiang-jiu/backend/Dockerfile
          push: false
          # load: true 将 buildx 构建结果载入本地 docker daemon,
          # 否则镜像只存在于 BuildKit 缓存, 后续 docker run 找不到镜像
          # 会尝试从 Docker Hub 拉取 → exit 125(该 job 自创建即失效)
          load: true
          tags: zhuxiang-decision-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        # Dockerfile 只装生产依赖(requirements.txt), 容器内无 pytest。
        # 挂载 requirements-dev.txt 与测试文件进容器临时安装后跑 pytest。
        # (镜像只 COPY 源码不含 test_*.py, 测试文件经挂载注入)
        run: |
          docker run --rm \
            -v $PWD/requirements-dev.txt:/tmp/requirements-dev.txt:ro \
            -v $PWD/conftest.py:/app/conftest.py:ro \
            -v $PWD/pytest.ini:/app/pytest.ini:ro \
            -v $PWD/test_:/app/test_ \
            zhuxiang-decision-api:ci-test \
            sh -c "pip install --no-cache-dir -r /tmp/requirements-dev.txt && cd /app && pytest test_ -v --junitxml=/tmp/test-results-docker.xml"

      - name: Extract test results from container
        if: always()
        run: |
          docker run --rm --entrypoint cat zhuxiang-decision-api:ci-test /tmp/test-results-docker.xml > test-results-docker.xml || true

      - name: Upload Docker test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: zhuxiang-jiu/backend/test-results-docker.xml
          retention-days: 30

  # ============================================================
  # Job 5: Force Parameter Unit Tests (Windows)
  # ============================================================
  force-param-test-windows:
    name: -Force Param Tests (Windows)
    runs-on: windows-latest
    needs: ps-version-check
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run -Force parameter tests
        shell: pwsh
        run: |
          .\test-force-parameter.ps1 -Verbose

      - name: Verify test report exists
        shell: pwsh
        run: |
          if (Test-Path "test-force-parameter-report.json") {
            $report = Get-Content "test-force-parameter-report.json" | ConvertFrom-Json
            Write-Host "`n## Force Parameter Test Report" 
            Write-Host "Total: $($report.total) | Passed: $($report.passed) | Failed: $($report.failed)"
            Write-Host "Success: $($report.success)"
            if (-not $report.success) { exit 1 }
          } else {
            Write-Host "ERROR: Report file not found"
            exit 1
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: force-param-test-report-win
          path: zhuxiang-jiu/backend/test-force-parameter-report.json
          retention-days: 30

  # ============================================================
  # Job 6: Force Parameter Unit Tests (Linux - pwsh cross-platform)
  # ============================================================
  force-param-test-linux:
    name: -Force Param Tests (Linux/pwsh)
    runs-on: ubuntu-latest
    needs: ps-version-check
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify pwsh availability
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "Platform: $($PSVersionTable.Platform)"

      - name: Run -Force parameter tests (pwsh)
        shell: pwsh
        run: |
          ./test-force-parameter.ps1 -Verbose

      - name: Verify test report exists
        shell: pwsh
        run: |
          $report = Get-Content "test-force-parameter-report.json" | ConvertFrom-Json
          Write-Host "`n## Force Parameter Test Report (Linux)"
          Write-Host "Total: $($report.total) | Passed: $($report.passed) | Failed: $($report.failed)"
          if (-not $report.success) { exit 1 }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: force-param-test-report-linux
          path: zhuxiang-jiu/backend/test-force-parameter-report.json
          retention-days: 30

  # ============================================================
  # Job 8: Concurrency Probe (asyncio.Lock regression baseline)
  # 验证 deduct/restock/upgrade 三个端点的 asyncio.Lock 在真并发下生效:
  #   - 超卖防护 / lost-update 防护 / 共享锁 / 无死锁
  # 探针脚本: probe_concurrency.py (httpx.AsyncClient + ASGITransport + asyncio.gather)
  # ============================================================
  concurrency-probe:
    name: Concurrency Probe (Linux)
    runs-on: ubuntu-latest
    needs: python-tests
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zhuxiang-jiu/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # probe_concurrency.py 用 httpx.ASGITransport 直驱 FastAPI, 需 httpx
          pip install -r requirements-dev.txt

      - name: Run concurrency probe (asyncio.Lock regression)
        run: |
          set -o pipefail
          python probe_concurrency.py 2>&1 | tee probe-output.log

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-probe-log
          path: zhuxiang-jiu/backend/probe-output.log
          retention-days: 30

  # ============================================================
  # Job 8b: Concurrency Probe - Shipping Claim (asyncio regression)
  # 验证 shipping_service.claim 的锁获取与冲突时序(批次1修复回归):
  #   - 5 agent 并发认领同区域 → 1 成功 + 4 冲突(锁序列化, lock_acquired 时间戳递增)
  #   - 同 agent 并发幂等认领 → 全部成功(idempotent=True)
  # 探针脚本: probe_shipping_claim_concurrency.py (ASGITransport 直驱, 走完整 FastAPI 栈)
  # 模式: asyncio(单进程, 无需 Redis), 与 Job 8 对齐
  # ============================================================
  concurrency-probe-shipping:
    name: Concurrency Probe Shipping (Linux)
    runs-on: ubuntu-latest
    needs: python-tests
    defaults:
      run:
        working-directory: zhuxiang-jiu/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zhuxiang-jiu/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # probe_shipping_claim_concurrency.py 用 httpx.ASGITransport, 需 httpx
          pip install -r requirements-dev.txt

      - name: Run shipping claim concurrency probe (asyncio regression)
        env:
          LOG_LEVEL: DEBUG
          LOCK_MODE: asyncio
          STORE_MODE: asyncio
        run: |
          set -o pipefail
          python probe_shipping_claim_concurrency.py 2>&1 | tee probe-shipping-output.log

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-probe-shipping-log
          path: zhuxiang-jiu/backend/probe-shipping-output.log
          retention-days: 30

  # ============================================================
  # Job 8b-redis: Concurrency Probe Shipping Redis (multi-process, distributed lock)
  # 验证 shipping:claim:{region} Redis 分布式锁在多进程下跨进程互斥 + 状态一致性
  # 对比 Job 8b(asyncio 单进程): 此 job 需 Redis 服务 + STORE_MODE=redis
  # 探针脚本: probe_shipping_claim_concurrency_multiworker.py
  #   - 启动 2 个独立 uvicorn 进程(端口 8765/8766)模拟多 worker
  #   - 场景1: 5 agent 跨进程并发认领同区域 → 1 成功 + 4 冲突 + Redis 状态一致
  #   - 场景2: 同 agent 跨进程幂等认领 → 全部成功 + Redis 状态一致
  # ============================================================
  concurrency-probe-shipping-redis:
    name: Concurrency Probe Shipping Redis (Linux)
    runs-on: ubuntu-latest
    needs: python-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCK_MODE: redis
      STORE_MODE: redis
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 装 requirements-dev.txt: pytest/pytest-asyncio/httpx(probe 脚本用 ASGITransport)
          pip install -r zhuxiang-jiu/backend/requirements-dev.txt

      - name: Verify Redis connectivity
        run: |
          python -c "import redis; r = redis.from_url('redis://127.0.0.1:6379/0'); print('Redis PING:', r.ping())"

      - name: Run shipping claim multi-process probe (Redis distributed lock)
        working-directory: zhuxiang-jiu/backend
        run: |
          set -o pipefail
          python probe_shipping_claim_concurrency_multiworker.py 2>&1 | tee probe-shipping-redis-output.log

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-probe-shipping-redis-log
          path: zhuxiang-jiu/backend/probe-shipping-redis-output.log
          retention-days: 30

  # ============================================================
  # Job 8c: Concurrency Probe Redis (multi-process, distributed lock)
  # 验证 Redis 分布式锁在多进程下跨进程互斥
  # 对比 Job 8(asyncio 单进程): 8c 需 Redis 服务 + LOCK_MODE=redis
  # ============================================================
  concurrency-probe-redis:
    name: Concurrency Probe Redis (Linux)
    runs-on: ubuntu-latest
    needs: python-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCK_MODE: redis
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 装 requirements-dev.txt: pytest/pytest-asyncio/httpx(probe 脚本用 ASGITransport)
          pip install -r zhuxiang-jiu/backend/requirements-dev.txt

      - name: Verify Redis connectivity
        run: |
          python -c "import redis; r = redis.from_url('redis://127.0.0.1:6379/0'); print('Redis PING:', r.ping())"

      - name: Run multi-process probe (Redis distributed lock)
        working-directory: zhuxiang-jiu/backend
        run: |
          set -o pipefail
          python probe_concurrency_multiworker.py 2>&1 | tee probe-redis-output.log

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-probe-redis-log
          path: zhuxiang-jiu/backend/probe-redis-output.log
          retention-days: 30

  # ============================================================
  # Job 8c: Redis Integration Tests (Repository + 锁 + 持久化)
  # 验证 Phase 1-3 的 Redis 持久化迁移: Repository 双模式 + 分布式锁
  # 依赖 Redis 服务, 通过 marker 过滤 -m redis
  # ============================================================
  redis-integration-tests:
    name: Redis Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: python-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCK_MODE: redis
      STORE_MODE: redis
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 装 requirements-dev.txt: pytest/pytest-asyncio/httpx(probe 脚本用 ASGITransport)
          pip install -r zhuxiang-jiu/backend/requirements-dev.txt

      - name: Verify Redis connectivity
        run: |
          python -c "import redis; r = redis.from_url('redis://127.0.0.1:6379/0'); print('Redis PING:', r.ping())"

      - name: Seed Redis data
        working-directory: zhuxiang-jiu/backend
        run: |
          python scripts/seed_redis.py

      - name: Run Redis integration tests
        working-directory: zhuxiang-jiu/backend
        run: |
          set -o pipefail
          python -m pytest test_redis_integration.py -m redis -v --tb=short 2>&1 | tee redis-integration-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-integration-test-results
          path: zhuxiang-jiu/backend/redis-integration-output.log
          retention-days: 30

  # ============================================================
  # Job 9: Summary (cross-platform consistency check)
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ps-version-check, python-tests, python-tests-windows, docker-build-test, force-param-test-windows, force-param-test-linux, concurrency-probe, concurrency-probe-shipping, concurrency-probe-shipping-redis, concurrency-probe-redis, redis-integration-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Platform |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| PS Version Check | ${{ needs.ps-version-check.result }} | Windows |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests.result }} | Ubuntu |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests-windows.result }} | Windows |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build+Test | ${{ needs.docker-build-test.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Force Param Tests | ${{ needs.force-param-test-windows.result }} | Windows |" >> $GITHUB_STEP_SUMMARY
          echo "| Force Param Tests | ${{ needs.force-param-test-linux.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Concurrency Probe | ${{ needs.concurrency-probe.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Concurrency Probe Shipping | ${{ needs.concurrency-probe-shipping.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Concurrency Probe Shipping Redis | ${{ needs.concurrency-probe-shipping-redis.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Concurrency Probe Redis | ${{ needs.concurrency-probe-redis.result }} | Linux |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any required job failed
          if [[ "${{ needs.ps-version-check.result }}" != "success" || \
                "${{ needs.python-tests.result }}" != "success" || \
                "${{ needs.python-tests-windows.result }}" != "success" || \
                "${{ needs.docker-build-test.result }}" != "success" || \
                "${{ needs.force-param-test-windows.result }}" != "success" || \
                "${{ needs.force-param-test-linux.result }}" != "success" || \
                "${{ needs.concurrency-probe.result }}" != "success" || \
                "${{ needs.concurrency-probe-shipping.result }}" != "success" || \
                "${{ needs.concurrency-probe-shipping-redis.result }}" != "success" || \
                "${{ needs.concurrency-probe-redis.result }}" != "success" ]]; then
            echo "One or more jobs failed!"
            exit 1
          fi
          echo "All tests passed on all platforms!"
