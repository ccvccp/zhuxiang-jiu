<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹香短剧 · 免费连播</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#232833;
          --text:#e8eaf0; --muted:#8a93a6; --brand:#0fdc78;
          --brand-text:#004d26; --lock:#2a2f3d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.7 "PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:10px; padding:8px 0 14px; }
  header img { width:34px; height:34px; border-radius:8px; }
  header b { font-size:16px; }
  header span { color:var(--muted); font-size:12px; }
  .player { position:relative; background:#000; border-radius:12px;
            overflow:hidden; }
  .player video { width:100%; aspect-ratio:9/16; max-height:70vh;
                  display:block; object-fit:contain; background:#000; }
  .lock-layer { position:absolute; inset:0; background:rgba(10,12,16,.82);
                display:flex; flex-direction:column; align-items:center;
                justify-content:center; gap:10px; text-align:center;
                padding:20px; }
  .lock-layer .tit { font-size:16px; font-weight:600; }
  .lock-layer .sub { color:var(--muted); font-size:12px; max-width:420px; }
  .btn { background:var(--brand); color:var(--brand-text); border:none;
         border-radius:999px; padding:10px 26px; font-size:14px;
         font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--brand);
               border:1px solid var(--brand); }
  .eps { margin-top:14px; }
  .eps h3 { font-size:14px; margin-bottom:10px; }
  .ep { display:flex; align-items:center; gap:12px; background:var(--card);
        border:1px solid var(--line); border-radius:10px; padding:10px 12px;
        margin-bottom:8px; cursor:pointer; }
  .ep.active { border-color:var(--brand); }
  .ep .num { width:30px; height:30px; border-radius:8px; background:var(--lock);
             display:flex; align-items:center; justify-content:center;
             font-size:13px; flex:none; }
  .ep.locked .num { color:var(--muted); }
  .ep .meta { flex:1; min-width:0; }
  .ep .meta b { font-size:14px; display:block;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep .meta span { color:var(--muted); font-size:12px; }
  .ep .tag { font-size:11px; padding:2px 8px; border-radius:999px;
             flex:none; }
  .tag.free { background:rgba(15,220,120,.14); color:var(--brand); }
  .tag.lock { background:var(--lock); color:var(--muted); }
  .tag.cp { background:rgba(15,220,120,.14); color:var(--brand); }
  .invite { margin-top:14px; background:var(--card);
            border:1px solid var(--line); border-radius:10px;
            padding:12px 14px; display:none; }
  .invite h4 { font-size:13px; margin-bottom:6px; }
  .invite p { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .invite .code { font-family:monospace; color:var(--brand);
                  font-weight:600; user-select:all; }
  .plans { display:flex; gap:10px; }
  .plans .btn { flex:1; padding:10px 8px; font-size:13px; }
  .plans .btn small { display:block; font-size:11px;
                      font-weight:400; opacity:.85; }
  footer { text-align:center; color:var(--muted); font-size:12px;
           padding:18px 0 30px; }
  footer a { color:var(--brand); text-decoration:none; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:var(--card); border:1px solid var(--line);
           color:var(--text); border-radius:999px; padding:8px 18px;
           font-size:13px; opacity:0; transition:opacity .2s; z-index:9; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="images/ip/ip-square.png" alt="竹香">
    <div><b>竹香短剧</b><br><span>AI 微短剧 · 免费连播</span></div>
  </header>

  <div class="player">
    <video id="video" controls playsinline
           poster="images/ip/ip-anim-poster.jpg"></video>
    <div class="lock-layer" id="lockLayer" style="display:none">
      <div class="tit" id="lockTitle">本集为会员专享内容</div>
      <div class="sub" id="lockSub">注册即可免费解锁本剧后段，超级会员全站短剧永久免费看。</div>
      <a class="btn" id="lockBtn" href="/login.html">注册免费解锁</a>
      <a class="btn ghost" id="lockInviteBtn" href="javascript:void(0)">邀 1 位好友解锁</a>
      <a class="btn ghost" id="lockMemberBtn" href="javascript:void(0)">开通超级会员</a>
    </div>
  </div>

  <div class="eps">
    <h3 id="epTitle">剧集列表</h3>
    <div id="epList"><div class="empty">加载中…</div></div>
  </div>

  <div class="invite" id="inviteBox">
    <h4>邀请好友 · 一起追剧</h4>
    <p id="inviteStat">我的邀请码 <span class="code" id="inviteCode">—</span></p>
    <button class="btn" id="inviteCopy" type="button">复制邀请链接</button>
  </div>

  <div class="invite" id="superBox">
    <h4>超级会员 · 全站短剧免费看</h4>
    <p id="superStat">一次开通，全站短剧永久免费 · 新剧抢先看</p>
    <div class="plans">
      <button class="btn" id="planForever" type="button">
        永久卡 ¥199<small>全站永久免费</small></button>
      <button class="btn ghost" id="planMonth" type="button">
        月卡 ¥29.9<small>30 天全站免费</small></button>
    </div>
  </div>

  <footer>理性饮酒 · 未满18岁请勿饮酒<br>
    <a href="/index.html">回首页</a></footer>
</div>
<div class="toast" id="toast"></div>

<script src="js/resonance-beacon.js" defer></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var dramaId = qs.get("d") || "";
  var SRC = qs.get("src") || "";
  var curDrama = null, curEp = null;
  var listEl = document.getElementById("epList");
  var video = document.getElementById("video");
  var lock = document.getElementById("lockLayer");
  var toastEl = document.getElementById("toast");

  /* ---------- 会话与漏斗埋点(collect 白名单事件) ---------- */
  var INV_KEY = "zx_inv";
  var invCode = qs.get("inv") || "";
  if (invCode) {
    try { sessionStorage.setItem(INV_KEY, invCode); } catch (e) { }
  }
  function storedInv() {
    try { return sessionStorage.getItem(INV_KEY) || ""; } catch (e) { return ""; }
  }
  function clearInv() {
    try { sessionStorage.removeItem(INV_KEY); } catch (e) { }
  }

  function sid() {
    try {
      var o = JSON.parse(localStorage.getItem("zx_rs") || "null");
      if (!o) { o = { id: "s_" + Date.now().toString(36) + "_" +
        Math.random().toString(36).slice(2, 10) }; }
      localStorage.setItem("zx_rs", JSON.stringify(o));
      return o.id;
    } catch (e) { return "s_mem_drama"; }
  }
  var SESSION = sid();
  function track(etype, payload) {
    try {
      fetch("/api/v1/resonance/collect", {
        method: "POST", keepalive: true,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: SESSION,
          events: [{ event_type: etype, page_id: "/drama.html",
                     payload: payload || {} }] })
      }).catch(function () { });
    } catch (e) { }
  }
  video.addEventListener("play", function () {
    if (curEp) { track("drama_play_start", {
      drama_id: dramaId, episode_id: curEp.episode_id }); }
  });
  video.addEventListener("ended", function () {
    if (curEp) { track("drama_play_complete", {
      drama_id: dramaId, episode_id: curEp.episode_id }); }
  });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* ---------- 登录态与解锁 ---------- */
  function token() {
    try { return (JSON.parse(
      localStorage.getItem("auth_session") || "null") || {}).token || "";
    } catch (e) { return ""; }
  }

  function doUnlock(ep) {
    var t = token();
    if (!t) {
      track("register_click", { drama_id: dramaId,
                                episode_id: ep.episode_id });
      location.href = "/login.html?redirect=" +
        encodeURIComponent(location.pathname + location.search);
      return;
    }
    fetch("/api/v1/unlocks", {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "Authorization": "Bearer " + t },
      body: JSON.stringify({ episode_id: ep.episode_id,
                             method: "register", src: SRC })
    }).then(function (r) { return r.json(); })
      .then(function (b) {
        var d = b.data || {};
        if (!d.episodes) { toast("解锁失败，请稍后再试"); return; }
        track("unlock_success", { drama_id: dramaId,
                                  episode_id: ep.episode_id });
        toast("已解锁本剧后段，免费继续观看");
        renderEpisodes(curDrama, d.episodes, ep.episode_id);
      }).catch(function () { toast("网络异常"); });
  }

  function fmtDur(s) {
    s = s || 0; var m = Math.floor(s / 60), r = s % 60;
    return m + "分" + (r < 10 ? "0" : "") + r + "秒";
  }

  /* ---------- DP3: 邀请裂变 ---------- */
  var inviteBox = document.getElementById("inviteBox");
  var inviteCodeEl = document.getElementById("inviteCode");
  var inviteStatEl = document.getElementById("inviteStat");
  var myCode = "";

  function tryBindInvite(t) {
    var inv = storedInv();
    if (!inv || !t) { return; }
    fetch("/api/v1/growth/referrals/bind", {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "Authorization": "Bearer " + t },
      body: JSON.stringify({ invite_code: inv })
    }).then(function (r) { return r.json(); })
      .then(function (b) {
        clearInv();
        if (b.code === 0) {
          track("invite_bound", { invite_code: inv });
          toast("已接受好友邀请，快去追剧吧");
        }
      }).catch(clearInv);
  }

  function shareUrl() {
    return location.origin + "/drama.html?d=" +
      (dramaId || (curDrama && curDrama.drama_id) || "") +
      "&inv=" + myCode;
  }

  function copyText(txt, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () {
        legacyCopy(txt); done();
      });
    } else { legacyCopy(txt); done(); }
  }
  function legacyCopy(txt) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { }
    document.body.removeChild(ta);
  }

  function fetchMyCode(then) {
    var t = token();
    if (!t) { return; }
    fetch("/api/v1/growth/invite-code", {
      method: "POST",
      headers: { "Authorization": "Bearer " + t }
    }).then(function (r) { return r.json(); })
      .then(function (b) {
        if (b.code === 0 && b.data) {
          myCode = b.data.invite_code || "";
          if (then) { then(); }
        }
      }).catch(function () { });
  }

  function renderInvitePanel() {
    var t = token();
    if (!t || !curDrama) { inviteBox.style.display = "none"; return; }
    inviteBox.style.display = "block";
    inviteCodeEl.textContent = myCode || "—";
    fetch("/api/v1/growth/invites/me", {
      headers: { "Authorization": "Bearer " + t }
    }).then(function (r) { return r.json(); })
      .then(function (b) {
        var d = b.data || {};
        var next = d.next_ladder;
        var tip = next
          ? ("已邀 " + (d.valid_count || 0) + " 人 · " +
             (next.title || "继续邀请得奖励"))
          : ("已邀 " + (d.valid_count || 0) + " 人 · 阶梯奖励已全部解锁");
        inviteStatEl.innerHTML =
          '我的邀请码 <span class="code" id="inviteCode">' + (myCode || "—") +
          "</span><br>" + tip;
      }).catch(function () { });
  }

  document.getElementById("inviteCopy").onclick = function () {
    if (!myCode) { fetchMyCode(function () { doCopy(); }); return; }
    doCopy();
  };
  function doCopy() {
    if (!myCode) { toast("邀请码生成中，请稍后再试"); return; }
    copyText(shareUrl(), function () {
      track("invite_share_click", { drama_id: dramaId });
      toast("邀请链接已复制，快发给好友吧");
    });
  }

  document.getElementById("lockInviteBtn").onclick = function () {
    var t = token();
    if (!t) {
      location.href = "/login.html?redirect=" +
        encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!myCode) {
      fetchMyCode(function () {
        copyText(shareUrl(), function () {
          toast("邀请链接已复制：好友注册观看后你解锁本剧");
        });
      });
      return;
    }
    copyText(shareUrl(), function () {
      toast("邀请链接已复制：好友注册观看后你解锁本剧");
    });
  };

  /* ---------- DP2b: 超级会员购买(pay60) ---------- */
  var superBox = document.getElementById("superBox");
  var superStatEl = document.getElementById("superStat");

  function renderSuperPanel(isSuper) {
    var t = token();
    if (!t) { superBox.style.display = "none"; return; }
    superBox.style.display = "block";
    if (isSuper) {
      superStatEl.textContent = "已是超级会员 · 全站短剧免费观看中";
    }
  }

  function pollPay(payNo, tries) {
    var t = token();
    if (!t) { return; }
    setTimeout(function () {
      fetch("/api/payment/" + payNo, {
        headers: { "Authorization": "Bearer " + t }
      }).then(function (r) { return r.json(); })
        .then(function (b) {
          if (b.status === "paid") {
            toast("支付成功 · 超级会员已开通");
            boot(curDrama);
          } else if ((tries || 0) < 30) {
            pollPay(payNo, (tries || 0) + 1);
          }
        }).catch(function () { });
    }, 2000);
  }

  function doPurchase(planId) {
    var t = token();
    if (!t) {
      location.href = "/login.html?redirect=" +
        encodeURIComponent(location.pathname + location.search);
      return;
    }
    track("member_page_view", { drama_id: dramaId, plan_id: planId });
    fetch("/api/v1/memberships/purchase", {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 "Authorization": "Bearer " + t },
      body: JSON.stringify({ plan_id: planId })
    }).then(function (r) { return r.json(); })
      .then(function (b) {
        var rec = b.data || {};
        if (b.code !== 0 || !rec.payNo) {
          toast("下单失败，请稍后再试"); return;
        }
        return fetch("/api/payment/" + rec.payNo + "/start", {
          method: "POST",
          headers: { "Authorization": "Bearer " + t }
        }).then(function (r2) { return r2.json(); })
          .then(function (s) {
            if (s.status === "paid") {
              toast("超级会员已开通 · 全站免费观看");
              boot(curDrama);
            } else if (s.status === "paying") {
              toast("支付单已创建，完成支付后自动开通");
              pollPay(rec.payNo);
            } else {
              toast("支付发起失败，请稍后再试");
            }
          });
      }).catch(function () { toast("网络异常"); });
  }

  document.getElementById("planForever").onclick = function () {
    doPurchase("super_forever"); };
  document.getElementById("planMonth").onclick = function () {
    doPurchase("super_month"); };
  document.getElementById("lockMemberBtn").onclick = function () {
    if (!token()) {
      location.href = "/login.html?redirect=" +
        encodeURIComponent(location.pathname + location.search);
      return;
    }
    superBox.style.display = "block";
    superBox.scrollIntoView({ behavior: "smooth" });
  };

  /* ---------- DP4: 锁层按钮按共鸣动态排序(checkpoint 响应) ---------- */
  var LOCK_SUB_DEFAULT = document.getElementById("lockSub").textContent;
  var lockBtnByType = {
    register: document.getElementById("lockBtn"),
    invite: document.getElementById("lockInviteBtn"),
    member: document.getElementById("lockMemberBtn"),
  };

  function reorderLockLayer(ep) {
    fetch("/api/v1/dramas/" + dramaId + "/episodes/" + ep.episode_id +
          "/checkpoint?session_id=" + encodeURIComponent(SESSION))
      .then(function (r) { return r.json(); })
      .then(function (b) {
        var ms = (b.data || {}).unlock_methods || [];
        if (!ms.length) { return; }
        var hint = "";
        ms.forEach(function (m) {
          var el = lockBtnByType[m.type];
          if (!el) { return; }
          lock.appendChild(el);            /* appendChild 移动即重排 */
          if (m.reward_hint) { hint = m.reward_hint; }
        });
        document.getElementById("lockSub").textContent =
          hint || LOCK_SUB_DEFAULT;
      }).catch(function () { });
  }

  function playEp(ep, title) {
    curEp = ep;
    document.getElementById("epTitle").textContent =
      "剧集列表 · " + (title || "");
    document.querySelectorAll(".ep").forEach(function (el) {
      el.classList.toggle("active",
        el.getAttribute("data-ep") === ep.episode_id);
    });
    if (!ep.is_unlocked) {
      video.pause(); video.removeAttribute("src");
      document.getElementById("lockTitle").textContent =
        "第" + ep.episode_number + "集 · 后段内容";
      lock.style.display = "flex";
      var btn = document.getElementById("lockBtn");
      btn.onclick = function (ev) {
        ev.preventDefault(); doUnlock(ep); };
      reorderLockLayer(ep);                /* DP4 动态排序(失败保持默认) */
      return;
    }
    lock.style.display = "none";
    video.src = ep.video_url;
    video.play().catch(function () { });
  }

  function renderEpisodes(d, eps, autoplayEp) {
    curDrama = d;
    document.title = d.title + " · 竹香短剧";
    listEl.innerHTML = "";
    eps.forEach(function (ep) {
      var el = document.createElement("div");
      el.className = "ep" + (ep.is_unlocked ? "" : " locked");
      el.setAttribute("data-ep", ep.episode_id);
      var tag = ep.is_checkpoint
        ? '<span class="tag cp">卡点集</span>'
        : (ep.is_unlocked ? '<span class="tag free">免费</span>'
                          : '<span class="tag lock">🔒 解锁</span>');
      el.innerHTML =
        '<div class="num">' + ep.episode_number + "</div>" +
        '<div class="meta"><b>' + (ep.title || "") + "</b>" +
        "<span>" + fmtDur(ep.duration_seconds) + "</span></div>" + tag;
      el.onclick = function () {
        if (!ep.is_unlocked) {
          track("checkpoint_shown", { drama_id: dramaId,
                                      episode_id: ep.episode_id });
        }
        playEp(ep, d.title);
      };
      listEl.appendChild(el);
    });
    var pick = eps.filter(function (e) {
      return e.episode_id === autoplayEp && e.is_unlocked; })[0]
      || eps.filter(function (e) { return e.is_unlocked; })[0];
    if (pick) { playEp(pick, d.title); }
  }

  function boot(d) {
    var t = token();
    var url = "/api/v1/dramas/" + d.drama_id + "/episodes";
    var headers = {};
    if (t) {
      url += "/me";                       /* DP2: 登录态会员/解锁合并视图 */
      headers = { "Authorization": "Bearer " + t };
    }
    fetch(url, { headers: headers })
      .then(function (r) { return r.json(); })
      .then(function (b) {
        var eps = (b.data || {}).episodes || [];
        if (t) {
          /* DP3: inv 码自动绑定(跨登录回跳) + 邀请面板 */
          tryBindInvite(t);
          fetchMyCode(renderInvitePanel);
        }
        if (t && (b.data || {}).is_super) {
          toast("超级会员 · 全站免费观看");
        }
        renderSuperPanel(t ? (b.data || {}).is_super : false);
        var lockedCp = eps.filter(function (e) {
          return e.is_checkpoint && !e.is_unlocked; })[0];
        if (lockedCp && t) {
          /* 已登录回跳: 自动幂等解锁(老用户免手动)
             先渲染锁定态(curDrama 就位), 解锁回调重渲全集 */
          renderEpisodes(d, eps);
          doUnlock(lockedCp);
          return;
        }
        if (lockedCp && !t) {
          track("checkpoint_shown", { drama_id: dramaId,
                                      episode_id: lockedCp.episode_id });
        }
        renderEpisodes(d, eps);
      });
  }

  if (dramaId) {
    fetch("/api/v1/dramas/" + dramaId)
      .then(function (r) { return r.json(); })
      .then(function (b) {
        var d = b.data;
        if (!d) { listEl.innerHTML =
          '<div class="empty">剧集不存在</div>'; return; }
        boot(d);
      });
  } else {
    fetch("/api/v1/dramas").then(function (r) { return r.json(); })
      .then(function (b) {
        var rows = b.data || [];
        if (!rows.length) { listEl.innerHTML =
          '<div class="empty">暂无上线短剧</div>'; return; }
        boot(rows[0]);
      });
  }
})();
</script>
</body>
</html>
