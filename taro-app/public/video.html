<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 14px/1.7 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
         background: #f4f1ea; color: #2f3e33; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10;
            background: linear-gradient(135deg, #355c44, #4a7c59);

  /* ---------- 播放器(自定义控制条) ---------- */
  .player { position: relative; border-radius: 10px; overflow: hidden;
            background: #000; }
  .player video { width: 100%; display: block; }
  .ctrl { display: flex; align-items: center; gap: 8px;

          background: linear-gradient(transparent, rgba(0,0,0,.72));
          color: #fff; }
  .ctrl .btn { width: 34px; height: 34px; flex-shrink: 0; border: 0;
               border-radius: 50%; background: rgba(255,255,255,.16);
               color: #fff; font-size: 15px; cursor: pointer;
               display: flex; align-items: center; justify-content: center;
               -webkit-tap-highlight-color: transparent; }
  .ctrl .btn:active { background: rgba(255,255,255,.34); }
  .ctrl .time { font-size: 11px; flex-shrink: 0;
                font-variant-numeric: tabular-nums; opacity: .95; }
  .bar { position: relative; flex: 1; height: 22px;
         display: flex; align-items: center;
         touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; height: 4px;
                border-radius: 2px; background: rgba(255,255,255,.28); }
  .bar .buf { position: absolute; left: 0; height: 4px; width: 0;
              border-radius: 2px; background: rgba(255,255,255,.5); }
  .bar .knob { position: absolute; width: 13px; height: 13px;
               border-radius: 50%; background: #7ec690; left: 0;
               transform: translateX(-50%); box-shadow: 0 1px 4px rgba(0,0,0,.5);
               pointer-events: none; }
  .rate { position: relative; flex-shrink: 0; }
  .rate > button { border: 0; border-radius: 14px; padding: 5px 11px;
                   font-size: 12px; cursor: pointer;
                   background: rgba(255,255,255,.16); color: #fff; }
  .rate .menu { display: none; position: absolute; right: 0; bottom: 40px;
                background: rgba(20,30,24,.95); border-radius: 10px;
                overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .rate .menu.show { display: block; }
  .rate .menu button { display: block; width: 100%; border: 0;
                       background: none; color: #dfe8df; font-size: 13px;
                       padding: 9px 18px; cursor: pointer; text-align: center; }
  .rate .menu button:hover, .rate .menu button:active { background: rgba(126,198,144,.25); }
  .rate .menu button.active { color: #7ec690; font-weight: 600; }

  .srcs { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  .srcs button { flex: 1; min-width: 120px; border: 1px solid #c3d4c8;
                 border-radius: 18px; padding: 8px 12px; font-size: 13px;
                 cursor: pointer; background: #fff; color: #355c44; }
  .srcs button.active { background: #355c44; color: #fff;
                        border-color: #355c44; font-weight: 600; }
  .meta { font-size: 12px; color: #8a978f; margin-top: 8px; }
  .meta b { color: #4a7c59; font-weight: 600; }
  .tip { text-align: center; font-size: 11px; color: #9aa7a0;
         padding: 10px 10px 4px; line-height: 1.9; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/" aria-label="返回首页">←</a>
  <div class="brand">竹香酒IP动画<small>品牌IP「麒」· 在线流式播放</small></div>
</div>
<div class="wrap">

  <div class="head">
    <img src="/images/ip/ip-transparent.png" alt="竹香酒IP·金鹿瑞兽「麒」">
    <h1>竹香酒IP动画</h1>
    <p>竹叶为角 · 如意为纹 · 品牌瑞兽「麒」</p>
  </div>

  <div class="card">
    <div class="player">
      <video id="player" playsinline preload="metadata"
             poster="/videos/ip-anim-poster.jpg"
             src="/videos/ip-animation-640.mp4"></video>
      <div class="ctrl">
        <button class="btn" id="playBtn" aria-label="播放/暂停">▶</button>
        <span class="time" id="tCur">0:00</span>
        <div class="bar" id="bar" aria-label="播放进度条">
          <div class="track"></div>
          <div class="buf" id="buf"></div>
          <div class="knob" id="knob"></div>
        </div>
        <span class="time" id="tDur">--:--</span>
        <div class="rate">
          <button id="rateBtn" aria-label="倍速">1.0x</button>
          <div class="menu" id="rateMenu">
            <button data-r="0.5">0.5x 慢速</button>
            <button data-r="1" class="active">1.0x 常速</button>
            <button data-r="1.25">1.25x</button>
            <button data-r="1.5">1.5x</button>
            <button data-r="2">2.0x 倍速</button>
          </div>
        </div>
      </div>
    </div>
    <div class="srcs">
      <button id="btnFull" class="active">完整版 4′41″</button>
      <button id="btnLoop">精华 20s 循环</button>
    </div>
    <div class="meta">在线流式播放(<b>进度条可拖动</b>, 按需缓冲)——<b>无需下载</b>完整文件; 支持 <b>0.5x~2.0x 倍速</b>。</div>
  </div>

  <div class="tip">
    过量饮酒有害健康 · 未成年人禁止饮酒 · 理性饮酒<br>
    © 竹香酒 zxjiu.com · <a href="/cert.html" style="color:#4a7c59;text-decoration:none">资质证书 ›</a>
  </div>

</div>
<script>
(function () {
  var v = document.getElementById('player');
  var playBtn = document.getElementById('playBtn');
  var bar = document.getElementById('bar');
  var knob = document.getElementById('knob');
  var buf = document.getElementById('buf');
  var tCur = document.getElementById('tCur');
  var tDur = document.getElementById('tDur');
  var rateBtn = document.getElementById('rateBtn');
  var rateMenu = document.getElementById('rateMenu');
  var bF = document.getElementById('btnFull');
  var bL = document.getElementById('btnLoop');
  var seeking = false;

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // ---- 播放/暂停 ----
  function toggle() { v.paused ? v.play().catch(function(){}) : v.pause(); }
  playBtn.onclick = toggle;
  v.onclick = toggle;                    // 点视频本体也可切换
  v.addEventListener('play', function () { playBtn.textContent = '⏸'; });
  v.addEventListener('pause', function () { playBtn.textContent = '▶'; });

  // ---- 进度条(pointer 拖动, 流式 seek) ----
  function ratioFromEvent(e) {
    var r = bar.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.min(1, Math.max(0, x / r.width));
  }
  function renderUI(ratio) {
    var pct = (ratio * 100).toFixed(3) + '%';
    knob.style.left = pct;
    buf.style.width = '0';               // 拖动态隐藏旧缓冲显示
    if (v.duration) tCur.textContent = fmt(ratio * v.duration);
  }
  function startSeek(e) {
    seeking = true;
    renderUI(ratioFromEvent(e));
    e.preventDefault();
  }
  function moveSeek(e) {
    if (!seeking) return;
    renderUI(ratioFromEvent(e));
    e.preventDefault();
  }
  function endSeek(e) {
    if (!seeking) return;
    seeking = false;
    var ratio = ratioFromEvent(e.changedTouches
               ? { clientX: e.changedTouches[0].clientX } : e);
    if (v.duration) v.currentTime = ratio * v.duration;   // 松手才真正 seek
  }
  bar.addEventListener('mousedown', startSeek);
  window.addEventListener('mousemove', moveSeek);
  window.addEventListener('mouseup', endSeek);
  bar.addEventListener('touchstart', startSeek, { passive: false });
  bar.addEventListener('touchmove', moveSeek, { passive: false });
  bar.addEventListener('touchend', endSeek);

  // ---- 播放中刷新(进度/缓冲/时间) ----
  v.addEventListener('timeupdate', function () {
    if (seeking || !v.duration) return;
    knob.style.left = (v.currentTime / v.duration * 100) + '%';
    tCur.textContent = fmt(v.currentTime);
  });
  v.addEventListener('progress', function () {
    if (seeking) return;
    try {
      var b = v.buffered;
      if (b.length && v.duration) {
        buf.style.width = (b.end(b.length - 1) / v.duration * 100) + '%';
      }
    } catch (e) { /* buffered 不可用时静默 */ }
  });
  v.addEventListener('durationchange', function () {
    tDur.textContent = fmt(v.duration);
  });

  // ---- 倍速菜单 ----
  rateBtn.onclick = function (e) {
    e.stopPropagation();
    rateMenu.classList.toggle('show');
  };
  rateMenu.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var r = parseFloat(btn.dataset.r);
    v.playbackRate = r;                  // 切源后保持
    rateBtn.textContent = r + 'x';
    [].forEach.call(rateMenu.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    rateMenu.classList.remove('show');
    e.stopPropagation();
  });
  document.addEventListener('click', function () {
    rateMenu.classList.remove('show');
  });

  // ---- 源切换(完整版/精华循环) ----
  // fullTime 独立记忆完整版离开位置(切去精华版不被其时间覆盖);
  // 换 src 会按规范重置 playbackRate——restore 回调统一恢复倍速
  var fullTime = 0;
  function pick(src, btn, loop) {
    if (!v.loop) fullTime = v.currentTime;   // 当前在完整版 → 记忆位置
    var wasPlaying = !v.paused;
    var rate = v.playbackRate;
    v.src = src;
    v.loop = loop;
    bF.classList.toggle('active', btn === bF);
    bL.classList.toggle('active', btn === bL);
    v.addEventListener('loadedmetadata', function restore() {
      v.removeEventListener('loadedmetadata', restore);
      v.playbackRate = rate;                // 恢复倍速(src 重置后)
      if (btn === bF && fullTime > 0 && fullTime < v.duration) {
        v.currentTime = fullTime;
      }
      if (wasPlaying) v.play().catch(function () {});
    });
  }
  bF.onclick = function () { pick('/videos/ip-animation-640.mp4', bF, false); };
  bL.onclick = function () { pick('/videos/ip-anim-480.mp4', bL, true); };
})();
</script>
