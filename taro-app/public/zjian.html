<!DOCTYPE html>
<!--
    zjian.html · 77号·竹鉴 BambooVerify C端质检查询页(自包含, 零外部依赖)
    ============================================================
    部署: 生产 dist 根 /var/www/zxjiu/dist/zjian.html(nginx try_files 直 serve)
    定位: 品质引证入口(URL 直达 https://zxjiu.com/zjian.html)——
          竹香酒产品域三闭环(75 工艺/76 内容/77 品质)
    主题: 品质青 #14665B × 签章红 #B5453C(检测报告权威感)
    数据源:
        游客(公开白名单 GET): /api/zjian/reports 双报告典藏 +
            /api/zjian/catalog 指标目录(15 项)
        登录(JWT): POST /api/zjian/verify 质检问答 +
            /api/zjian/compare 规格比对
    鉴权: 精简 JWT 链——login → localStorage 'zhuxiang.auth' →
          apiFetch(401 → refresh → retry 一次自愈)
    呈现: 引证应答卡(规格 pill + 指标明细表 + 检测方法 +
          报告号引证 + 灰度留痕); 医疗/夸大断言拦截友好化;
          15 项双规格比对表
    本地调试: zjian.html?api=http://localhost:8001 覆盖 API base。
    ============================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14665B">
<title>竹鉴 BambooVerify · 品质检测查询 - 竹香酒</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
            "Helvetica Neue", "Microsoft YaHei", sans-serif;
        background: #F4F7F6; color: #24352f; line-height: 1.65;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 14px 40px; }

    /* 顶栏(品质青) */
    .topbar {
        position: sticky; top: 0; z-index: 20;
        background: linear-gradient(135deg, #14665B, #0d4a42);
        color: #fff; padding: 12px 16px;
        display: flex; align-items: center; justify-content: space-between;
        box-shadow: 0 2px 8px rgba(20,102,91,.25);
    }
    .brand { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
    .brand small { font-weight: 400; opacity: .75; font-size: 11px; display: block; letter-spacing: 0; }
    .brand .seal { color: #e8a9a0; }
    .auth-box { text-align: right; }
    .btn {
        border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
        padding: 7px 14px; background: rgba(255,255,255,.16); color: #fff;
    }
    .btn:active { opacity: .8; }
    .btn.primary { background: #14665B; color: #fff; }
    .btn.seal { background: #B5453C; color: #fff; }
    .btn.ghost { background: #fff; color: #14665B; border: 1px solid #c2d6d1; }
    .user-chip { font-size: 12px; opacity: .9; margin-bottom: 4px; }

    /* 报告卡 */
    .hero { margin: 14px 0; display: grid; gap: 10px; }
    .report-card {
        background: #fff; border-radius: 12px; padding: 16px;
        box-shadow: 0 1px 4px rgba(20,102,91,.08);
        border-top: 3px solid #14665B;
    }
    .report-card.b52 { border-top-color: #14665B; }
    .report-card.b42 { border-top-color: #B5453C; }
    .report-card h1 { font-size: 16px; color: #0d4a42; margin-bottom: 4px; }
    .report-card h1 .spec {
        font-size: 11px; border-radius: 4px; padding: 1px 8px;
        vertical-align: 2px; margin-left: 6px; font-weight: 600;
    }
    .b52 .spec { background: #e3efec; color: #14665B; }
    .b42 .spec { background: #f8e9e7; color: #B5453C; }
    .report-card p { font-size: 12px; color: #5b6b66; }
    .report-card .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { display: inline-block; font-size: 10px; border-radius: 4px;
        background: #eef4f2; color: #14665B; padding: 2px 7px; }
    .tag.red { background: #f8e9e7; color: #B5453C; }

    /* 查询区 */
    .ask-card {
        background: #fff; border-radius: 12px; padding: 16px;
        box-shadow: 0 1px 4px rgba(20,102,91,.08); margin-bottom: 14px;
    }
    .ask-card h2 { font-size: 15px; color: #0d4a42; margin-bottom: 10px; }
    .ask-row { display: flex; gap: 8px; }
    .ask-row input {
        flex: 1; border: 1px solid #c2d6d1; border-radius: 8px;
        padding: 10px 12px; font-size: 14px; outline: none;
    }
    .ask-row input:focus { border-color: #14665B; }
    .login-hint { font-size: 12.5px; color: #8a978f; margin-top: 10px; }
    .login-hint a { color: #14665B; cursor: pointer; text-decoration: underline; }
    .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
        border: 1px solid #c2d6d1; background: #f4f8f7; color: #14665B;
        border-radius: 12px; padding: 3px 10px; font-size: 11.5px;
        cursor: pointer;
    }

    /* 应答流 */
    .msg { margin: 12px 0; }
    .msg .who { font-size: 11px; color: #8a978f; margin-bottom: 3px; }
    .bubble { border-radius: 10px; padding: 11px 13px; font-size: 13.5px; }
    .bubble.user { background: #14665B; color: #fff; margin-left: 15%; }
    .bubble.bot { background: #fff; box-shadow: 0 1px 3px rgba(20,102,91,.08); margin-right: 4%; }
    .bubble.blocked { background: #fdf6f0; border: 1px solid #e8cbb0; }
    .thinking { color: #8a978f; font-size: 12px; padding: 6px 2px; }
    .spec-pill { display: inline-block; font-size: 10px; border-radius: 8px;
        padding: 1px 8px; margin-bottom: 6px; font-weight: 600; }
    .spec-pill.s52 { background: #e3efec; color: #14665B; }
    .spec-pill.s42 { background: #f8e9e7; color: #B5453C; }
    table.mtable { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
    .mtable th { text-align: left; color: #8a978f; padding: 4px 5px;
        border-bottom: 1px solid #e4ece9; white-space: nowrap; }
    .mtable td { padding: 4px 5px; border-bottom: 1px solid #eef3f1; }
    .mtable .pass { color: #1f7a4d; font-weight: 600; }
    .meta { margin-top: 7px; font-size: 10.5px; color: #9aa7a0; }
    .meta .cite { color: #B5453C; }

    /* 比对表 */
    .cmp-card {
        background: #fff; border-radius: 12px; padding: 16px;
        box-shadow: 0 1px 4px rgba(20,102,91,.08); margin-bottom: 14px;
        overflow-x: auto;
    }
    .cmp-card h2 { font-size: 15px; color: #0d4a42; margin-bottom: 10px; }
    table.cmp { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .cmp th { background: #eef4f2; color: #14665B; padding: 5px 6px;
        text-align: left; white-space: nowrap; }
    .cmp td { padding: 4px 6px; border-bottom: 1px solid #eef3f1; }

    /* 游客面: 指标目录 */
    .sec-title {
        font-size: 15px; color: #0d4a42; margin: 20px 0 10px;
        display: flex; align-items: center; gap: 8px;
    }
    .sec-title:before { content: ""; width: 4px; height: 16px;
        background: #14665B; border-radius: 2px; display: inline-block; }
    .panel { background: #fff; border-radius: 10px; padding: 14px;
        box-shadow: 0 1px 3px rgba(20,102,91,.06); }

    /* 登录抽屉 */
    .drawer-mask { display: none; position: fixed; inset: 0; z-index: 30;
        background: rgba(10,32,28,.45); }
    .drawer-mask.show { display: block; }
    .drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
        background: #fff; border-radius: 16px 16px 0 0; padding: 20px 18px 28px;
        display: none; max-width: 680px; margin: 0 auto; }
    .drawer.show { display: block; }
    .drawer h3 { font-size: 16px; color: #0d4a42; margin-bottom: 4px; }
    .drawer .sub { font-size: 12px; color: #8a978f; margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: #5b6b66; display: block; margin-bottom: 4px; }
    .field input { width: 100%; border: 1px solid #c2d6d1; border-radius: 8px;
        padding: 10px 12px; font-size: 14px; outline: none; }
    .field input:focus { border-color: #14665B; }
    .form-err { color: #B5453C; font-size: 12px; min-height: 16px; margin-bottom: 6px; }

    footer { text-align: center; font-size: 11px; color: #9aa7a0;
        padding: 18px 10px 8px; line-height: 1.8; }
    footer a { color: #14665B; text-decoration: none; }
    .toast { position: fixed; left: 50%; bottom: 90px;
        transform: translateX(-50%); background: rgba(13,74,66,.92);
        color: #fff; font-size: 12.5px; border-radius: 18px; padding: 8px 18px;
        z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none;
        max-width: 80%; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">竹鉴 <span class="seal">BambooVerify</span><small>品质检测查询 · 引证式应答</small></div>
    <div class="auth-box" id="authBox"></div>
</div>

<div class="wrap">

    <!-- 双检测报告卡(游客可见) -->
    <div class="hero" id="reportsHero">
        <div class="report-card"><p>加载检测报告典藏中…</p></div>
    </div>

    <!-- 质检查询区 -->
    <div class="ask-card">
        <h2>问问竹鉴</h2>
        <div class="ask-row">
            <input id="questionInput" maxlength="1000"
                placeholder="如：52型酒精度多少 / 甲醇检出没 / 安全性怎么样">
            <button class="btn primary" onclick="askVerify()">查询</button>
        </div>
        <div class="chips">
            <span class="chip" onclick="fillQ('52型酒精度多少')">52型酒精度</span>
            <span class="chip" onclick="fillQ('42型总酸多少')">42型总酸</span>
            <span class="chip" onclick="fillQ('甲醇检出没')">甲醇</span>
            <span class="chip" onclick="fillQ('安全性怎么样')">安全性汇总</span>
            <span class="chip" onclick="fillQ('标签合规吗')">标签</span>
        </div>
        <div class="login-hint" id="loginHint"></div>
        <div id="askFlow"></div>
    </div>

    <!-- 规格比对 -->
    <div class="cmp-card">
        <h2>双规格全指标比对（15 项）</h2>
        <button class="btn seal" style="width:100%;padding:10px"
            onclick="loadCompare()">生成比对表</button>
        <div id="cmpBox" style="margin-top:12px"></div>
    </div>

    <!-- 指标目录(游客) -->
    <div class="sec-title">检测指标目录 · 15 项</div>
    <div class="panel" style="overflow-x:auto">
        <table class="cmp">
            <thead><tr>
                <th>指标</th><th>技术要求</th><th>单位</th><th>检测方法</th>
            </tr></thead>
            <tbody id="catalogRows"><tr><td colspan="4">加载中…</td></tr></tbody>
        </table>
    </div>

    <footer>
        竹鉴为确定性质检引证（LLM 禁入）· 检测数据不作医疗功效
        或绝对化宣传 · 报告典藏人工锚定永不自主<br>
        <a href="zyh.html">🎋 竹酒知识问答（竹韵·智衡）</a> ·
        <a href="synapse.html">🧵 品牌内容织造（织智）</a> ·
        健康警示：过量饮酒有害健康
    </footer>
</div>

<!-- 登录抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="loginDrawer">
    <h3>登录解锁质检查询</h3>
    <div class="sub">会员登录后可使用引证式质检问答</div>
    <div class="field">
        <label>手机号</label>
        <input id="phoneInput" type="tel" maxlength="11" placeholder="13800000001">
    </div>
    <div class="field">
        <label>密码</label>
        <input id="pwdInput" type="password" placeholder="登录密码">
    </div>
    <div class="form-err" id="formErr"></div>
    <button class="btn primary" style="width:100%;padding:11px" onclick="doLogin()">登 录</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    /* ---------- API base(同域反代; ?api= 覆盖供本地调试) ---------- */
    var API = (function () {
        var m = location.search.match(/[?&]api=([^&]+)/);
        if (m) { return decodeURIComponent(m[1]).replace(/\/+$/, ''); }
        return '';
    })();

    var AUTH_KEY = 'zhuxiang.auth';

    function $(id) { return document.getElementById(id); }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                     '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function toast(msg) {
        var t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function () { t.classList.remove('show'); }, 2200);
    }
    window.fillQ = function (q) {
        $('questionInput').value = q;
        $('questionInput').focus();
    };

    /* ---------- 会话(精简 JWT 链——同 zyh/synapse) ---------- */

    function session() {
        try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; }
        catch (e) { return null; }
    }
    function saveSession(body) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({
            token: body.accessToken,
            refreshToken: body.refreshToken || null,
            memberId: body.memberId || null,
            name: body.name || body.nickname || null,
            savedAt: Date.now(),
        }));
    }
    function clearSession() { localStorage.removeItem(AUTH_KEY); }

    async function apiFetch(path, options) {
        var s = session();
        var opts = options || {};
        if (s && s.token) {
            opts.headers = Object.assign({}, opts.headers, {
                'Authorization': 'Bearer ' + s.token,
            });
        }
        var res = await fetch(API + path, opts);
        if (res.status === 401 && s && s.refreshToken && !opts._retried) {
            var ok = await refresh();
            if (ok) {
                opts._retried = true;
                return apiFetch(path, opts);
            }
            clearSession();
            renderAuth();
            throw new Error('登录已过期，请重新登录');
        }
        return res;
    }

    async function refresh() {
        var s = session();
        if (!s || !s.refreshToken) { return false; }
        try {
            var res = await fetch(API + '/api/auth/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken: s.refreshToken }),
            });
            var body = await res.json();
            if (res.ok && body && body.accessToken) {
                saveSession(body);
                return true;
            }
        } catch (e) { /* 网络异常按失败处理 */ }
        return false;
    }

    /* ---------- 顶栏渲染 ---------- */

    function renderAuth() {
        var s = session();
        if (s && s.token) {
            $('authBox').innerHTML =
                '<div class="user-chip">会员 '
                + esc(s.name || (s.memberId != null ? '#' + s.memberId : ''))
                + '</div><button class="btn" onclick="doLogout()">退出</button>';
            $('loginHint').innerHTML =
                '已登录——技术应答必附检测报告引证。';
        } else {
            $('authBox').innerHTML =
                '<button class="btn" onclick="toggleDrawer(true)">登录</button>';
            $('loginHint').innerHTML = '游客可浏览报告典藏与指标目录；'
                + '<a onclick="toggleDrawer(true)">登录</a> 后解锁质检查询。';
        }
    }

    window.toggleDrawer = function (show) {
        $('loginDrawer').classList.toggle('show', show);
        $('drawerMask').classList.toggle('show', show);
        if (!show) { $('formErr').textContent = ''; }
    };

    window.doLogin = async function () {
        var phone = $('phoneInput').value.trim();
        var pwd = $('pwdInput').value;
        if (!/^1\d{10}$/.test(phone)) {
            $('formErr').textContent = '请输入 11 位手机号'; return;
        }
        if (!pwd) { $('formErr').textContent = '请输入密码'; return; }
        try {
            var res = await fetch(API + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, password: pwd }),
            });
            var body = await res.json();
            if (res.ok && body && body.accessToken) {
                saveSession(body);
                toggleDrawer(false);
                renderAuth();
                toast('登录成功，开始质检查询');
            } else {
                $('formErr').textContent = (body && (body.detail || body.message))
                    || '登录失败，请检查手机号与密码';
            }
        } catch (e) {
            $('formErr').textContent = '网络异常，请稍后重试';
        }
    };

    window.doLogout = function () {
        clearSession();
        renderAuth();
        toast('已退出登录');
    };

    /* ---------- 质检查询(决策面 POST /api/zjian/verify) ---------- */

    window.askVerify = async function () {
        var q = $('questionInput').value.trim();
        if (!q) { toast('请输入问题'); return; }
        if (!(session() || {}).token) {
            toggleDrawer(true);
            toast('请先登录再查询');
            return;
        }
        $('questionInput').value = '';
        appendUser(q);
        var holder = appendThinking('竹鉴检索典藏，引证中…');
        try {
            var res = await apiFetch('/api/zjian/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q }),
            });
            var body = await res.json();
            holder.remove();
            if (res.status === 409) {
                appendBlocked('质检查询暂未开放（灰度关闭中），'
                    + '报告典藏与指标目录可正常浏览。');
                return;
            }
            if (!res.ok) {
                appendBlocked('请求失败(' + res.status + ')：'
                    + ((body && (body.detail || body.message))
                       || '请稍后重试'));
                return;
            }
            appendAnswer(body);
        } catch (e) {
            holder.remove();
            appendBlocked(e.message || '网络异常');
        }
    };

    $('questionInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { askVerify(); }
    });

    function appendUser(text) {
        var div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = '<div class="who">我</div>'
            + '<div class="bubble user">' + esc(text) + '</div>';
        $('askFlow').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return div;
    }

    function appendThinking(text) {
        var div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = '<div class="bubble bot thinking" style="margin-left:4%">'
            + esc(text) + '</div>';
        $('askFlow').appendChild(div);
        return div;
    }

    function appendBlocked(msg) {
        var div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = '<div class="who">竹鉴 · 提示</div>'
            + '<div class="bubble bot blocked">' + esc(msg) + '</div>';
        $('askFlow').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function appendAnswer(b) {
        var html = '<div class="who">竹鉴 · 引证应答</div>'
            + '<div class="bubble bot">';
        if (b.guardrailsTriggered) {
            html += esc(b.content || '')
                + (b.citations && b.citations.length
                    ? '<div class="meta">参考报告: '
                    + b.citations.map(function (c2) {
                        return '<span class="cite">' + esc(c2.id) + '</span>';
                    }).join(' · ') + '</div>' : '')
                + '</div>';
        } else if (b.noMetricHit) {
            html += esc(b.content || '') + '</div>';
        } else {
            var rows = (b.items || []).map(function (it) {
                var pass = it.verdict === '符合';
                return '<tr><td>' + esc(it.metric) + '</td><td>'
                    + esc(it.result) + (it.unit && it.unit !== '/'
                        ? ' ' + esc(it.unit) : '')
                    + '</td><td>' + esc(it.requirement) + '</td><td>'
                    + (pass ? '<span class="pass">符合</span>'
                        : esc(it.verdict)) + '</td><td>'
                    + esc(it.method) + '</td></tr>';
            }).join('');
            var specPills = (b.specs || []).map(function (sp) {
                var cls = sp.indexOf('52') >= 0 ? 's52' : 's42';
                return '<span class="spec-pill ' + cls + '">'
                    + esc(sp) + '</span>';
            }).join(' ');
            var cites = (b.citations || []).map(function (c2) {
                return '<span class="cite">' + esc(c2.id) + '</span>';
            }).join(' · ');
            html += specPills
                + '<table class="mtable"><thead><tr>'
                + '<th>指标</th><th>实测</th><th>技术要求</th>'
                + '<th>判定</th><th>检测方法</th></tr></thead>'
                + '<tbody>' + rows + '</tbody></table>'
                + '<div class="meta">报告引证: ' + cites
                + (b.zjianMode ? ' · 灰度 ' + esc(b.zjianMode) : '')
                + '</div></div>';
        }
        var div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = html;
        $('askFlow').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    /* ---------- 规格比对(决策面 POST /api/zjian/compare) ---------- */

    window.loadCompare = async function () {
        if (!(session() || {}).token) {
            toggleDrawer(true);
            toast('请先登录后生成比对');
            return;
        }
        $('cmpBox').innerHTML =
            '<div class="thinking">比对生成中…</div>';
        try {
            var res = await apiFetch('/api/zjian/compare',
                                     { method: 'POST' });
            var body = await res.json();
            if (!res.ok) {
                $('cmpBox').innerHTML =
                    '<div class="thinking">比对失败(' + res.status
                    + ')</div>';
                return;
            }
            var rows = (body.rows || []).map(function (r) {
                return '<tr><td>' + esc(r.metric) + '</td><td>'
                    + esc(r.r52) + '</td><td>' + esc(r.r42)
                    + '</td><td>' + esc(r.requirement) + '</td></tr>';
            }).join('');
            $('cmpBox').innerHTML =
                '<table class="cmp"><thead><tr><th>指标</th>'
                + '<th>' + esc(body.specA || '52%vol 型') + '</th>'
                + '<th>' + esc(body.specB || '42%vol 型') + '</th>'
                + '<th>技术要求</th></tr></thead><tbody>'
                + rows + '</tbody></table>'
                + '<div class="meta" style="font-size:10.5px;'
                + 'color:#9aa7a0;margin-top:6px">报告引证: '
                + (body.citations || []).map(function (c2) {
                    return '<span class="cite">' + esc(c2.id) + '</span>';
                }).join(' · ') + '</div>';
        } catch (e) {
            $('cmpBox').innerHTML =
                '<div class="thinking">' + esc(e.message) + '</div>';
        }
    };

    /* ---------- 游客面加载 ---------- */

    function loadReports() {
        fetch(API + '/api/zjian/reports').then(function (r) {
            return r.json();
        }).then(function (d) {
            var items = (d.items || []).slice().sort(function (a, b2) {
                return a.spec < b2.spec ? 1 : -1;
            });
            if (!items.length) {
                $('reportsHero').innerHTML =
                    '<div class="report-card"><p>典藏加载失败，请刷新重试</p></div>';
                return;
            }
            $('reportsHero').innerHTML = items.map(function (r) {
                var cls = r.spec.indexOf('52') >= 0 ? 'b52' : 'b42';
                var alcohol = (r.metrics || {}).alcohol || {};
                var notDetected = Object.keys(r.metrics || {})
                    .filter(function (k) {
                        var m = r.metrics[k];
                        return m && m.result
                            && String(m.result).indexOf('未检出') >= 0;
                    }).length;
                return '<div class="report-card ' + cls + '">'
                    + '<h1>瑞麒竹奕酒<span class="spec">'
                    + esc(r.spec) + '</span></h1>'
                    + '<p>' + esc(r.agency || '') + ' · 签发 '
                    + esc(r.signDate || '') + ' · 酒精度实测 '
                    + esc(alcohol.result || '-') + '%vol</p>'
                    + '<div class="tags">'
                    + '<span class="tag red">报告 ' + esc(r.reportId) + '</span>'
                    + (r.basis || []).map(function (b3) {
                        return '<span class="tag">' + esc(b3) + '</span>';
                    }).join('')
                    + '<span class="tag">未检出指标 ' + notDetected + ' 项</span>'
                    + '</div></div>';
            }).join('');
        }).catch(function () {
            $('reportsHero').innerHTML =
                '<div class="report-card"><p>典藏加载失败，请刷新重试</p></div>';
        });
    }

    function loadCatalog() {
        fetch(API + '/api/zjian/catalog').then(function (r) {
            return r.json();
        }).then(function (d) {
            var rows = (d.items || []).map(function (it) {
                return '<tr><td>' + esc(it.name) + '</td><td>'
                    + esc(it.requirement) + '</td><td>'
                    + esc(it.unit) + '</td><td>'
                    + esc(it.method) + '</td></tr>';
            }).join('');
            $('catalogRows').innerHTML = rows
                || '<tr><td colspan="4">暂无数据</td></tr>';
        }).catch(function () {
            $('catalogRows').innerHTML =
                '<tr><td colspan="4">加载失败</td></tr>';
        });
    }

    renderAuth();
    loadReports();
    loadCatalog();
})();
</script>
</body>
</html>
