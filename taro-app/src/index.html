<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#355c44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="竹香酒" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no,email=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>竹香酒</title>
    <script>
      // 固定 html fontSize，防止 flexible 脚本动态修改
      (function() {
        var html = document.documentElement;
        html.style.fontSize = '18px';
        Object.defineProperty(html.style, 'fontSize', {
          get: function() { return '18px'; },
          set: function() { /* 忽略所有修改 */ }
        });
      })();
      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 站点手工资产入口(2026-10-01 裸 dist 部署清掉语音/IP 情景入口
         事故后迁入构建流程: 资产本体在 public/, 经 config copy 出包;
         注入清单对齐事故前线上态 dist.bak-t79: 语音唤醒 v92 +
         IP 情景卡 + 72号 变体渲染) -->
    <script defer src="/js/scene-widget.js"></script>
    <script defer src="/js/voice-wake-widget.js?v=95"></script>
    <script defer src="/js/v72-variant.js?v=1"></script>
    <!-- 官网 PC 首页入口(2026-10-02: 商城左下浮标, official.html 直达) -->
    <script defer src="/js/official-entry.js?v=1"></script>
  </body>
</html>
