services:
  backend:
    build: ./zhuxiang-jiu/backend
    ports:
      - "8000:8000"
    env_file:
      # P4.1 部署加固: LLM 密钥与功能开关经 .env 注入(不落盘, .gitignore 已忽略)
      # 参见 .env.example; 功能开关默认 off, 上线按需逐轨开启
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCK_MODE=redis
      - STORE_MODE=redis
      - PORT=8000
      - HOST=0.0.0.0
      # ---- P4.1 LLM 配置(默认关闭; 覆盖 .env 同名项) ----
      # 总开关与密钥: LLM_ENABLED/LLM_API_KEY/LLM_BASE_URL 经 .env 注入
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-15}
      - LLM_VISION_TIMEOUT=${LLM_VISION_TIMEOUT:-60}
      # 各功能轨开关(默认 off; .env 中设 on 开启)
      - KNOWLEDGE_CHAT_LLM=${KNOWLEDGE_CHAT_LLM:-off}
      - KNOWLEDGE_EMBEDDING=${KNOWLEDGE_EMBEDDING:-off}
      - KNOWLEDGE_MEDIA_LLM=${KNOWLEDGE_MEDIA_LLM:-off}
      - KNOWLEDGE_CRAWL_LLM=${KNOWLEDGE_CRAWL_LLM:-off}
      - KNOWLEDGE_RERANK=${KNOWLEDGE_RERANK:-off}
      # 模型名(按需在 .env 覆盖)
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-3}
      - ASR_MODEL=${ASR_MODEL:-glm-asr-2512}
      - RERANK_MODEL=${RERANK_MODEL:-rerank}
      # 后台调度开关(默认 off)
      - AI_LEARNING_AUTO=${AI_LEARNING_AUTO:-off}
      - ORDER_TIMEOUT_AUTO=${ORDER_TIMEOUT_AUTO:-off}
      - KNOWLEDGE_QUALITY_AUTO=${KNOWLEDGE_QUALITY_AUTO:-off}
      # PYTHONUNBUFFERED 已在 Dockerfile 中设置(ENV),此处无需重复
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 内存限制: 给 backend 充足空间(pip install + uvicorn 启动峰值约 400MB)
    # mem_limit: 容器内存硬上限(cgroup)
    # memswap_limit: 内存 + swap 上限(允许借用 swap 缓冲峰值)
    # mem_reservation: 软预留(Linux 内核压力下尽量保证)
    mem_limit: 1g
    memswap_limit: 2g
    mem_reservation: 512m
    # 允许 OOM killer 杀死本容器(false=不禁用 OOM kill,即内存超限时本容器会被杀)
    oom_kill_disable: false
    # 启动前先 seed Redis(幂等, 可重复执行)
    # seed 失败不阻塞启动(后端重启时会再试)
    # 显式 cd /app 确保工作目录正确(Dockerfile 的 WORKDIR 会被某些场景覆盖)
    # 显式 exec 替换 sh 进程,让 uvicorn 成为 PID 1 接收 SIGTERM
    command: >
      sh -c "cd /app &&
             python scripts/seed_redis.py || echo '[WARN] seed failed, continuing...';
             cd /app &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    # 健康检查: FastAPI /api/decision/health 端点(无需认证)
    # 依赖容器内 curl; Dockerfile 已安装
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/decision/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    # 国内网络无法直连 docker.io, 走 DaoCloud 公益镜像站前缀拉取
    # (daemon.json registry-mirrors 在 containerd 存储模式下不生效, 前缀法与配置无关)
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    # 健康检查:backend 依赖此条件才启动
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  redis-data:
