services:
  backend:
    build: ./zhuxiang-jiu/backend
    ports:
      - "8000:8000"
    env_file:
      # P4.1 部署加固: LLM 密钥与功能开关经 .env 注入(不落盘, .gitignore 已忽略)
      # 参见 .env.example; 功能开关默认 off, 上线按需逐轨开启
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCK_MODE=redis
      - STORE_MODE=redis
      - PORT=8000
      - HOST=0.0.0.0
      # ---- P4.1 LLM 配置(默认关闭; 覆盖 .env 同名项) ----
      # 总开关与密钥: LLM_ENABLED/LLM_API_KEY/LLM_BASE_URL 经 .env 注入
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-15}
      - LLM_VISION_TIMEOUT=${LLM_VISION_TIMEOUT:-60}
      # 各功能轨开关(默认 off; .env 中设 on 开启)
      - KNOWLEDGE_CHAT_LLM=${KNOWLEDGE_CHAT_LLM:-off}
      - KNOWLEDGE_EMBEDDING=${KNOWLEDGE_EMBEDDING:-off}
      - KNOWLEDGE_MEDIA_LLM=${KNOWLEDGE_MEDIA_LLM:-off}
      - KNOWLEDGE_CRAWL_LLM=${KNOWLEDGE_CRAWL_LLM:-off}
      - KNOWLEDGE_RERANK=${KNOWLEDGE_RERANK:-off}
      # 模型名(按需在 .env 覆盖)
      - VISION_MODEL=${VISION_MODEL:-glm-4v-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-3}
      - ASR_MODEL=${ASR_MODEL:-glm-asr-2512}
      - RERANK_MODEL=${RERANK_MODEL:-rerank}
      # 后台调度开关(默认 off)
      - AI_LEARNING_AUTO=${AI_LEARNING_AUTO:-off}
      - ORDER_TIMEOUT_AUTO=${ORDER_TIMEOUT_AUTO:-off}
      - KNOWLEDGE_QUALITY_AUTO=${KNOWLEDGE_QUALITY_AUTO:-off}
      # ---- 41号 直发平台真实接入(默认 mock; 见 docs/直发通道接入真实API凭证待办清单.md) ----
      # 三态: mock(默认) / real(fail-hard) / mock_fallback(真实轨失败回退 mock)
      # 灰度顺序: mock → mock_fallback(≥48h 观察) → real
      - DRIDE_CHANNEL_MODE=${DRIDE_CHANNEL_MODE:-mock}
      - DRIDE_PARTNER_URL=${DRIDE_PARTNER_URL:-}
      # 平台鉴权(二选一): APP_ID+APP_SECRET(HMAC 签名头) 或 TOKEN(Bearer)
      - DRIDE_PARTNER_APP_ID=${DRIDE_PARTNER_APP_ID:-}
      - DRIDE_PARTNER_APP_SECRET=${DRIDE_PARTNER_APP_SECRET:-}
      - DRIDE_PARTNER_TOKEN=${DRIDE_PARTNER_TOKEN:-}
      # 回调签名令牌(real 模式上线前必须配置, 否则回调端点不校验)
      - DRIDE_PARTNER_CALLBACK_TOKEN=${DRIDE_PARTNER_CALLBACK_TOKEN:-}
      # 输出坐标系: wgs84(默认, 本站内部口径) / gcj02(滴滴高德系, 凭证到手后切)
      - DRIDE_COORD_SYS=${DRIDE_COORD_SYS:-wgs84}
      # ---- 43号 AI智能安全管理(默认 observe 灰度只留痕; 见 docs/安全管理端操作指南.md) ----
      # 总开关: off=一键回退(网关全放行, fail-open 铁律)
      - SECURITY_GATEWAY_MODE=${SECURITY_GATEWAY_MODE:-on}
      # 灰度: observe(默认, 只留痕) / shadow(演练) / enforce(四档真处置)
      # enforce 上线检查单: 见 docs/安全管理端操作指南.md §六
      - SECURITY_ENFORCE_LEVEL=${SECURITY_ENFORCE_LEVEL:-observe}
      # 频次窗口与上限(误杀多则上调 RATE_LIMIT)
      - SECURITY_RATE_WINDOW=${SECURITY_RATE_WINDOW:-60}
      - SECURITY_RATE_LIMIT=${SECURITY_RATE_LIMIT:-120}
      # 自动封禁时长(秒, 到点自动解封)
      - SECURITY_BAN_TTL=${SECURITY_BAN_TTL:-900}
      # ---- 43号 P3-2 真实验证码通道(默认 mock; 凭证经 .env 注入) ----
      # 三态: mock(默认, 应答非空即过) / real(服务商校验, fail-hard) /
      #        mock_fallback(真实轨传输故障回退 mock, 回执标记来源)
      - SECURITY_CAPTCHA_MODE=${SECURITY_CAPTCHA_MODE:-mock}
      # 服务商: geetest(v4, 国内合规首选) / hcaptcha(海外备选)
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-geetest}
      - CAPTCHA_ID=${CAPTCHA_ID:-}
      - CAPTCHA_KEY=${CAPTCHA_KEY:-}
      # ---- 43号 P3-3 GeoIP 离线库(mmdb 文件挂载, 缺失则 geo 静默关闭) ----
      # GeoLite2-City.mmdb 放宿主机 ./data/ 下(MaxMind 免费下载, 不入 git)
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/data/GeoLite2-City.mmdb}
      # ---- 43号 P4-2 安全调度器(UEBA基线日度重建, 默认 off 主动开启) ----
      - SECURITY_SCHEDULER_MODE=${SECURITY_SCHEDULER_MODE:-off}
      - SECURITY_UEBA_REBUILD_INTERVAL=${SECURITY_UEBA_REBUILD_INTERVAL:-86400}
      # ---- 43号 P5-1 D5 强制联动(默认 off——三条件达标后人工开启) ----
      # 达标口径: GET /admin/reports/d5(观察期≥14天+误报率<5%+样本≥20)
      # on 语义: D5 命中且威胁分∈边界区 → 升档 challenge(永不单独 block)
      - SECURITY_D5_ENFORCE=${SECURITY_D5_ENFORCE:-off}
      # 联动边界区(威胁分窗口, 默认挑战档 25-50; 可调如 50-70 覆盖减速档)
      - SECURITY_D5_ENFORCE_BAND=${SECURITY_D5_ENFORCE_BAND:-25-50}
      # ---- 43号 P5-3 威胁情报自动订阅(默认 off 主动开启; 周度拉取) ----
      # 拉取失败 fail-soft 旧段保留(情报宁旧勿空); 连续3次失败 degraded
      - SECURITY_THREATINTEL_AUTO=${SECURITY_THREATINTEL_AUTO:-off}
      # 情报源(默认 firehol_level1 官方 raw; 国内可换镜像如 ghproxy)
      - SECURITY_THREATINTEL_URL=${SECURITY_THREATINTEL_URL:-https://raw.githubusercontent.com/firehol/blocklist/master/firehol_level1.netset}
      # 拉取周期(秒, 默认 7 天; 下限 3600 防误配忙循环)
      - SECURITY_THREATINTEL_INTERVAL=${SECURITY_THREATINTEL_INTERVAL:-604800}
      # ---- 43号 P6-1 情报源聚合与规模扩展 ----
      # 多源列表(name=url 逗号分隔; 空则回退单 URL 变量——P5-3 兼容)
      - SECURITY_THREATINTEL_URLS=${SECURITY_THREATINTEL_URLS:-}
      # 单次导入段数上限(部署态默认 200000 支持聚合全量 ~180k;
      # 代码默认 20000 兼容——提额为显式运维决策)
      - SECURITY_THREATINTEL_MAX_CIDRS=${SECURITY_THREATINTEL_MAX_CIDRS:-200000}
      # ---- 44号 API 智能管理(P1: Key 面总开关/审批开关, 默认零影响) ----
      # on=开启 API Key 消费方凭证网关(仅拦截台账 status=published 的 API)
      - API_MANAGER_MODE=${API_MANAGER_MODE:-off}
      # on=申请即批秒级发放(默认); off=进管理队列人工批
      - API_KEY_AUTO_APPROVE=${API_KEY_AUTO_APPROVE:-on}
      # ---- 43号 P5-4 AbuseIPDB 单 IP 实时情报(默认 mock 无 key 可测) ----
      # 三态: mock(确定性三档) / real(Bearer key) / mock_fallback(失败回退)
      - SECURITY_ABUSEIPDB_MODE=${SECURITY_ABUSEIPDB_MODE:-mock}
      # API key(免费档 1000 次/天; real 态必填, 经 .env 注入不入 git)
      - SECURITY_ABUSEIPDB_KEY=${SECURITY_ABUSEIPDB_KEY:-}
      # 配额红线(默认 900 预留 100 手动余量; 超限走 fallback)
      - SECURITY_ABUSEIPDB_DAILY_LIMIT=${SECURITY_ABUSEIPDB_DAILY_LIMIT:-900}
      # ---- 43号 P5-5 GeoLite2 距离跳变阈值(mmdb 就位即启用) ----
      # 2h 窗口位移超过此值(km)触发异地跳变信号; 同城宽带 ~50km 不误杀
      - SECURITY_GEO_VELOCITY_KM=${SECURITY_GEO_VELOCITY_KM:-500}
      # ---- 47号 验真风控(P3: 先验回流, 默认 off——画像只沉淀不干预) ----
      # on=画像信任度回流验真通道: v2 起点折扣 + L2/L3 入分
      # 层级乘性(restricted ×0.5 / watched ×0.8 / trusted ×1.1)
      - RISK_PRIOR_MODE=${RISK_PRIOR_MODE:-off}
      # ---- 48号 小竹语音中枢(P1/P3: 两轨默认 off——规则轨/手动扫描兜底) ----
      # on=LLM 意图增强轨(白名单 action 抽参, 数字仍来自 API;
      #     off=规则轨 track=rule 兜底, 无 key 依赖)
      - XIAOZHU_LLM_MODE=${XIAOZHU_LLM_MODE:-off}
      # on=主动关怀日度调度(7天/人/类型频控+日上限;
      #     off=仅手动触发 POST /api/xiaozhu/proactive/scan)
      - XIAOZHU_PROACTIVE_MODE=${XIAOZHU_PROACTIVE_MODE:-off}
      # ---- 53号 小竹智能登录引擎(P0-P5: 编排层, 默认 off——直通存量 39号登录) ----
      # on=多模态编排面开放(态势感知/五通道编排/语音唤醒/门户/驻留);
      #     off=编排面 409 直通存量 39号 entry 登录(零接管), 观测面不受影响
      - LOGIN53_MODE=${LOGIN53_MODE:-off}
      # ---- 55号 二维码AI智能管理(P0-P5: 生成/核销面, 默认 off——存量二维码链路零影响) ----
      # on=智能生码/扫码核销/完成标记开放(白名单注册表+HMAC 签名
      #     +49号预算联动+千面适配); off=生成/核销 409(观测面
      #     registry/model/codes/stats/governance/dashboard 不受影响)
      - QR55_MODE=${QR55_MODE:-off}
      # on=T+1 学习调度(过期清扫+决策回流补标+指标快照+Hedge 学习
      #     +回归检测自动回滚); off=仅手动触发(collect/learn 端点)
      - QR55_LEARN_MODE=${QR55_LEARN_MODE:-off}
      # 调度周期秒(默认 24h; 下限 300 防忙循环; 首轮在 interval 之后)
      - QR55_LEARN_INTERVAL=${QR55_LEARN_INTERVAL:-86400}
      # 滑动窗口回归检测阈值(rewardAlignment 下降超此值自动回滚+46号冻结)
      - QR55_REGRESSION_THRESHOLD=${QR55_REGRESSION_THRESHOLD:-0.3}
      # HMAC 签名密钥(生产必须强随机值经 .env 注入, 缺省 dev 仅限开发;
      # 轮换使存量未核销码失效——默认 TTL 300s, 影响窗口 ≤5 分钟)
      - QR55_SECRET=${QR55_SECRET:-dev}
      # ---- 57号 AI智能知识库(P0-P5: 决策面三级灰度, 默认 off——存量知识链路零影响) ----
      # shadow=观察学习期(仅缺口诊断+采集留痕); assist=辅助生产期
      #     (三重合规鉴别+种子工坊+终审发布+会员面植入开放);
      #     off=决策面 409(观测面 registry/gaps/seeds/dashboard 等不受影响)
      - KB57_MODE=${KB57_MODE:-off}
      # on=T+1 决策回流补标+种子有效期健康检查调度; off=仅手动触发
      #     (POST /api/kb57/feedback/collect)
      - KB57_LEARN_MODE=${KB57_LEARN_MODE:-off}
      # 调度周期秒(默认 24h; 下限 300 防忙循环; 首轮在 interval 之后)
      - KB57_LEARN_INTERVAL=${KB57_LEARN_INTERVAL:-86400}
      # ---- 58号 AI智能优化意图识别(P0-P4: 决策面三级灰度, 默认 off——存量意图链路零影响) ----
      # shadow=观察学习期(仅评估留痕); assist=辅助优化期(语料+标注+反馈开放);
      #     off=决策面 409(观测面 registry/evaluations/corpus/thresholds 等不受影响)
      - II58_MODE=${II58_MODE:-off}
      # L2 LLM 路由(assist 态低置信路由+合成建议, 默认 off)
      - II58_LLM_MODE=${II58_LLM_MODE:-off}
      # on=T+1 决策回流补标调度(六类真值信号+44号池双写+高置信错误预警);
      #     off=仅手动触发(POST /api/ii58/feedback/collect)
      - II58_LEARN_MODE=${II58_LEARN_MODE:-off}
      # 调度周期秒(默认 24h; 下限 300 防忙循环; 首轮在 interval 之后)
      - II58_LEARN_INTERVAL=${II58_LEARN_INTERVAL:-86400}
      # PYTHONUNBUFFERED 已在 Dockerfile 中设置(ENV),此处无需重复
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # 43号 P3-3 GeoIP 离线库(宿主机 ./data/GeoLite2-City.mmdb,
      # MaxMind 免费下载; 缺失时 geo 功能静默关闭零影响)
      - ./data:/app/data:ro
    # 内存限制: 给 backend 充足空间(pip install + uvicorn 启动峰值约 400MB)
    # mem_limit: 容器内存硬上限(cgroup)
    # memswap_limit: 内存 + swap 上限(允许借用 swap 缓冲峰值)
    # mem_reservation: 软预留(Linux 内核压力下尽量保证)
    mem_limit: 1g
    memswap_limit: 2g
    mem_reservation: 512m
    # 允许 OOM killer 杀死本容器(false=不禁用 OOM kill,即内存超限时本容器会被杀)
    oom_kill_disable: false
    # 启动前先 seed Redis(幂等, 可重复执行)
    # seed 失败不阻塞启动(后端重启时会再试)
    # 显式 cd /app 确保工作目录正确(Dockerfile 的 WORKDIR 会被某些场景覆盖)
    # 显式 exec 替换 sh 进程,让 uvicorn 成为 PID 1 接收 SIGTERM
    command: >
      sh -c "cd /app &&
             python scripts/seed_redis.py || echo '[WARN] seed failed, continuing...';
             cd /app &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    # 健康检查: FastAPI /api/decision/health 端点(无需认证)
    # 依赖容器内 curl; Dockerfile 已安装
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/decision/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    # 国内网络无法直连 docker.io, 走 DaoCloud 公益镜像站前缀拉取
    # (daemon.json registry-mirrors 在 containerd 存储模式下不生效, 前缀法与配置无关)
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    # 健康检查:backend 依赖此条件才启动
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  redis-data:
  hub-media:
