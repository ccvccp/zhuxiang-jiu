services:
  backend:
    build: ./zhuxiang-jiu/backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCK_MODE=redis
      - STORE_MODE=redis
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 启动前先 seed Redis(幂等, 可重复执行)
    # seed 失败不阻塞启动(后端重启时会再试)
    command: >
      sh -c "python scripts/seed_redis.py || echo '[WARN] seed failed, continuing...';
             uvicorn main:app --host 0.0.0.0 --port 8000"
    # 健康检查: FastAPI /api/decision/health 端点(无需认证)
    # 依赖容器内 curl; Dockerfile 已安装
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/decision/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    # 健康检查:backend 依赖此条件才启动
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  redis-data:
