# ============================================================
# Prometheus 配置文件
# 用途: 采集 Redis / Node / cAdvisor / Backend 指标
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'zhuxiang-monitor'
    env: 'local'

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ============================
  # Redis Exporter
  # ============================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          env: 'local'

  # ============================
  # Node Exporter (主机指标)
  # ============================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'
          env: 'local'

  # ============================
  # cAdvisor (容器指标)
  # ============================
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'containers'
          env: 'local'

  # ============================
  # Backend 应用
  # ============================
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          env: 'local'
    metrics_path: '/metrics'
