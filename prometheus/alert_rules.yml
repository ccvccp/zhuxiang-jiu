# ============================================================
# Prometheus 告警规则
# 包含: Redis / Backend / 主机 三类告警
# ============================================================

groups:
  # ============================
  # Redis 告警规则
  # ============================
  - name: redis_alerts
    rules:
      # Redis 宕机
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 宕机"
          description: "Redis {{ $labels.instance }} 已宕机超过 1 分钟"

      # 内存使用率过高
      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis 内存使用率过高"
          description: "Redis 内存使用率 {{ $value }}% 超过 80%"

      # 连接数过多
      - alert: RedisTooManyConnections
        expr: redis_connected_clients > 100
        for: 2m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis 连接数过多"
          description: "Redis 当前连接数 {{ $value }} 超过 100"

      # 内存碎片率过高
      - alert: RedisMemoryFragmentation
        expr: redis_memory_fragmentation_ratio > 1.5
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis 内存碎片率过高"
          description: "Redis 内存碎片率 {{ $value }} 超过 1.5"

      # 慢查询
      - alert: RedisSlowQueries
        expr: rate(redis_slowlog_last_id[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis 存在慢查询"
          description: "Redis 过去 5 分钟内有新的慢查询"

      # AOF 持久化异常
      - alert: RedisAOFDisabled
        expr: redis_config_appendonly != 1
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis AOF 持久化未开启"
          description: "生产环境必须开启 AOF 持久化"

  # ============================
  # Backend 应用告警规则
  # ============================
  - name: backend_alerts
    rules:
      # Backend 宕机
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend 服务宕机"
          description: "Backend {{ $labels.instance }} 已宕机超过 30 秒"

      # API 响应时间过长
      - alert: BackendSlowResponse
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend API 响应缓慢"
          description: "P95 响应时间 {{ $value }}s 超过 1s"

      # 错误率过高
      - alert: BackendHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend 错误率过高"
          description: "5xx 错误率 {{ $value }}% 超过 5%"

  # ============================
  # 主机/容器告警规则
  # ============================
  - name: infra_alerts
    rules:
      # 主机 CPU 使用率过高
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机 CPU 使用率过高"
          description: "CPU 使用率 {{ $value }}% 超过 80%"

      # 主机内存不足
      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "主机内存不足"
          description: "可用内存 {{ $value }}% 低于 10%"

      # 磁盘空间不足
      - alert: HostDiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "磁盘空间不足"
          description: "根分区可用空间 {{ $value }}% 低于 10%"

      # 容器 OOM
      - alert: ContainerOomKilled
        expr: increase(container_memory_failcnt[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "容器发生 OOM"
          description: "容器 {{ $labels.name }} 发生 OOM Kill"
