<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 竹香酒管理平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-banner {
            background: linear-gradient(135deg, #355c44, #4a7c59);
            color: #fff; padding: 30px 0; text-align: center;
        }
        .login-banner h1 { font-size: 24px; margin: 0; }
        .login-banner p { margin: 6px 0 0; opacity: .85; font-size: 13px; }

        .login-section { padding: 28px 0 10px; }
        .login-card {
            background: var(--color-bg-card); border: 1px solid var(--color-border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            max-width: 420px; margin: 0 auto; padding: 26px 28px;
        }
        .login-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
        .login-tab {
            flex: 1; text-align: center; padding: 9px 0; font-size: 14px;
            border: 1px solid var(--color-border); border-radius: var(--radius-sm);
            cursor: pointer; color: var(--color-text-light); transition: var(--transition);
            background: var(--color-bg);
        }
        .login-tab.active {
            background: var(--color-primary); color: #fff;
            border-color: var(--color-primary); font-weight: 700;
        }
        .login-form { display: none; flex-direction: column; gap: 14px; }
        .login-form.active { display: flex; }
        .form-item label {
            display: block; font-size: 12px; color: var(--color-text-light);
            margin-bottom: 5px;
        }
        .form-item input {
            width: 100%; box-sizing: border-box; padding: 9px 12px;
            border: 1px solid var(--color-border); border-radius: var(--radius-sm);
            font-size: 14px; background: #fff;
        }
        .form-item input:focus { outline: none; border-color: var(--color-primary); }
        .login-btn {
            border: none; border-radius: var(--radius-sm); cursor: pointer;
            padding: 11px 0; font-size: 14px; width: 100%;
            background: var(--color-primary); color: #fff; transition: var(--transition);
        }
        .login-btn:hover { background: var(--color-primary-dark); }
        .login-btn:disabled { opacity: .55; cursor: not-allowed; }
        .login-error {
            display: none; background: #fdecea; color: var(--color-danger);
            border: 1px solid #f5c6c0; border-radius: var(--radius-sm);
            padding: 9px 12px; font-size: 13px; word-break: break-all;
        }
        .login-tip {
            font-size: 12px; color: var(--color-text-light); line-height: 1.8;
            border-top: 1px dashed var(--color-border); padding-top: 12px; margin-top: 4px;
        }
        .login-tip code {
            background: var(--color-bg); border: 1px solid var(--color-border);
            border-radius: 3px; padding: 1px 5px; font-size: 11px;
        }
        .login-foot { padding: 18px 0 30px; text-align: center; }
        .login-foot a { color: var(--color-primary); font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>
    <header class="login-banner">
        <div class="container">
            <h1>竹香酒 · 管理平台登录</h1>
            <p>统一鉴权入口（会员 / 管理员）· 登录后自动回跳原页面</p>
        </div>
    </header>

    <main class="container login-section">
        <div class="login-card">
            <div class="login-tabs">
                <div class="login-tab active" data-tab="member" onclick="switchTab('member')">👤 会员登录</div>
                <div class="login-tab" data-tab="admin" onclick="switchTab('admin')">🛡️ 管理员登录</div>
            </div>
            <div class="login-error" id="errorBanner"></div>

            <!-- 会员登录表单 -->
            <form class="login-form active" id="form-member" onsubmit="doMemberLogin(event)">
                <div class="form-item">
                    <label>手机号</label>
                    <input type="tel" id="m-phone" placeholder="13800000002" required
                           pattern="1[3-9]\d{9}" title="请输入 11 位手机号">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="m-password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn" id="m-submit">登 录</button>
            </form>

            <!-- 管理员登录表单 -->
            <form class="login-form" id="form-admin" onsubmit="doAdminLogin(event)">
                <div class="form-item">
                    <label>管理员用户名</label>
                    <input type="text" id="a-username" placeholder="admin" required>
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="a-password" placeholder="请输入管理员密码" required>
                </div>
                <div class="form-item">
                    <label>动态口令（已开启 2FA 时填写，否则留空）</label>
                    <input type="text" id="a-totp" placeholder="6 位数字（可选）" maxlength="6">
                </div>
                <div class="form-item">
                    <label>绑定会员手机号（换发统一 JWT，留空则用用户名尝试）</label>
                    <input type="tel" id="a-phone" placeholder="13800000002">
                </div>
                <button type="submit" class="login-btn" id="a-submit">管理员登录</button>
            </form>

            <div class="login-tip">
                <b>说明</b>：登录后统一使用 JWT 令牌（<code>Authorization: Bearer</code>）访问管理端点，
                支持 <code>AUTH_MODE=strict</code> 严格模式。本地演示账号：会员 <code>13800000001 / test123456</code>，
                管理员角色会员 <code>13800000002 / test123456</code>。管理员登录先校验后台管理员凭证，
                再用绑定手机号换发统一令牌（已开启 2FA 的账号请直接使用会员入口）。
            </div>
        </div>
    </main>

    <footer class="login-foot">
        <a href="index.html">← 返回官网首页</a>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        'use strict';

        function switchTab(name) {
            document.querySelectorAll('.login-tab').forEach(function (t) {
                t.classList.toggle('active', t.dataset.tab === name);
            });
            document.querySelectorAll('.login-form').forEach(function (f) {
                f.classList.toggle('active', f.id === 'form-' + name);
            });
            hideError();
        }

        function showError(msg) {
            var el = document.getElementById('errorBanner');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function hideError() {
            document.getElementById('errorBanner').style.display = 'none';
        }

        /** 登录成功: 已登录则跳回 redirect(防开放跳转仅取文件名), 否则回知识库运营台 */
        function afterLogin() {
            var params = new URLSearchParams(location.search);
            var back = params.get('redirect') || '';
            // 只允许站内相对文件名(拒绝 //host、协议前缀与 javascript: 伪协议)
            if (back && !back.startsWith('/') && back.indexOf(':') < 0) {
                location.href = back;
                return;
            }
            location.href = 'knowledge-dashboard.html';
        }

        async function doMemberLogin(e) {
            e.preventDefault();
            hideError();
            var btn = document.getElementById('m-submit');
            btn.disabled = true; btn.textContent = '登录中…';
            var r = await Auth.login({
                phone: document.getElementById('m-phone').value.trim(),
                password: document.getElementById('m-password').value,
            });
            btn.disabled = false; btn.textContent = '登 录';
            if (r.success) { afterLogin(); return; }
            showError('登录失败：' + r.error);
        }

        async function doAdminLogin(e) {
            e.preventDefault();
            hideError();
            var btn = document.getElementById('a-submit');
            btn.disabled = true; btn.textContent = '登录中…';
            var r = await Auth.adminLogin({
                username: document.getElementById('a-username').value.trim(),
                password: document.getElementById('a-password').value,
                totpCode: document.getElementById('a-totp').value.trim() || null,
                adminPhone: document.getElementById('a-phone').value.trim() || null,
            });
            btn.disabled = false; btn.textContent = '管理员登录';
            if (r.success) { afterLogin(); return; }
            showError('管理员登录失败：' + r.error);
        }

        // 已登录直接回跳
        (function init() {
            if (Auth.isLoggedIn()) { afterLogin(); return; }
        })();
    </script>
</body>
</html>
