#   权威源=服务器 C:\nginx\conf\nginx.conf; 改动前先经 deploy/aliyun-ecs-rpc.ps1 取实时 conf, 勿以本快照为源直改。
# zyjiu/zxjiu 国内 ECS (8.147.66.237) · nginx/Windows
# 静态=C:/www/dist 本地化; /api 反代海外 nginx 443 (后端容器只绑海外)
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 上游=海外 nginx(443, vhost zyjiu.com 已含双域 SAN 证书)
    proxy_ssl_server_name on;
    proxy_ssl_name zyjiu.com;
    # UA 分流(2026-10-20 竹盾补齐, 设计源 deploy/zxjiu.conf.work 2026-10-02):
    # PC 裸根 -> official.html 官网首页; 移动端/带参(72号引流落地) -> index.html SPA
    map $http_user_agent $zxjiu_is_mobile {
        default 0;
        "~*(android|iphone|ipod|ipad|mobile|harmony|phone)" 1;
    }
    map "$zxjiu_is_mobile$args" $zxjiu_home {
        default /index.html;
        "0" /official.html;
    }


    server {
        listen       80;
        server_name  zyjiu.com zxjiu.com www.zxjiu.com;

        root   C:/www/dist;
        index  index.html;

        location ^~ /api/visual/ { proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; proxy_read_timeout 60s; client_max_body_size 16m; }
        location ^~ /js/  { expires 30d; add_header Cache-Control "public, immutable"; }
        location ^~ /css/ { expires 30d; add_header Cache-Control "public, immutable"; }
        location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        # 根路径 UA 分流(2026-10-20 竹盾补齐): 精确匹配先于目录回退, try_files 命中后本 location 处理
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $zxjiu_home =404;
        }


        # html no-cache(2026-10-19): no header -> heuristic cache, deploys never reach users
        location ~ \.html$ { add_header Cache-Control "no-cache, must-revalidate"; }

        include site-proxy.conf;
    }

    server {
        listen       443 ssl;
        server_name  zyjiu.com zxjiu.com www.zxjiu.com;

        ssl_certificate      cert.pem;
        ssl_certificate_key  key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        root   C:/www/dist;
        index  index.html;

        location ^~ /api/visual/ { proxy_pass http://127.0.0.1:8200; proxy_set_header Host $host; proxy_read_timeout 60s; client_max_body_size 16m; }
        location ^~ /js/  { expires 30d; add_header Cache-Control "public, immutable"; }
        location ^~ /css/ { expires 30d; add_header Cache-Control "public, immutable"; }
        location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        # 根路径 UA 分流(2026-10-20 竹盾补齐): 精确匹配先于目录回退, try_files 命中后本 location 处理
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $zxjiu_home =404;
        }


        # html no-cache(2026-10-19): no header -> heuristic cache, deploys never reach users
        location ~ \.html$ { add_header Cache-Control "no-cache, must-revalidate"; }

        include site-proxy.conf;
    }
}