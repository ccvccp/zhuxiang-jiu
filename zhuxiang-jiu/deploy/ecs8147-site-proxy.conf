# 鍏辩敤鍙嶄唬娈?80/443 include): SEO + WS + 閫氱敤 /api
# [2026-10-19] 结算mock修复chunk破缓存(bundle热修)
    location = /js/common.0ad2fc19.js { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /js/common.de40aaca.js { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host zyjiu.com;
    proxy_read_timeout 30s;
}
location = /robots.txt {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host zyjiu.com;
    proxy_read_timeout 30s;
