<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="var(--color-primary-dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>酒类介绍 - 竹香酒 · 竹奕系列</title>
    <meta name="description" content="竹奕酒全系产品介绍，独创竹香型，经典系列、珍藏系列、年份系列、礼盒系列等，翠竹酿造，匠心之选。">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 移动端筛选折叠(2026-10-21): 商品网格首屏优先, 筛选面板收起为按钮——
           修复移动端首屏被侧栏霸占、商品沉底一屏外的"空壳"观感 */
        .filter-toggle-btn { display: none; }
        @media (max-width: 768px) {
            .sidebar { padding: 12px; }
            .sidebar h3, .sidebar .filter-group { display: none; margin-bottom: 0; }
            .sidebar .filter-toggle-btn {
                display: block;
                width: 100%;
                padding: 12px 16px;
                background: #f0f5ef;
                border: 1px solid var(--color-primary, #4a7c59);
                color: var(--color-primary-dark, #2d5a3d);
                border-radius: 10px;
                font-size: 15px;
                font-family: inherit;
                cursor: pointer;
            }
            .sidebar.expanded h3, .sidebar.expanded .filter-group { display: block; }
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <div class="page-banner">
        <div class="container">
            <h1>酒类介绍</h1>
            <p>福来就喝竹奕酒，天赐鸿运随心走！</p>
            <p style="margin-top:10px;font-size:12px;color:rgba(255,255,255,0.75);letter-spacing:1px;">⚠️ 过量饮酒有害健康 · 未成年人禁止购买和饮用酒类</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a><span>/</span>酒类介绍
        </div>

        <div class="products-layout">
            <!-- 侧边栏：分类筛选 -->
            <aside class="sidebar">
                <button class="filter-toggle-btn" id="filterToggle" type="button">筛选 ▾</button>
                <h3>🌿 产品分类</h3>
                <div class="filter-group">
                    <h4>香型</h4>
                    <ul class="filter-list" id="categoryFilter">
                        <li class="active" data-cat="all">全部产品（竹香型）</li>
                        <li data-cat="竹香型">竹香型（全系主打）</li>
                    </ul>
                </div>
                <div class="filter-group">
                    <h4>系列</h4>
                    <ul class="filter-list" id="seriesFilter">
                        <li class="active" data-series="all">全部系列</li>
                        <li data-series="竹香系列">竹香系列（主打）</li>
                        <li data-series="经典系列">经典系列</li>
                        <li data-series="珍藏系列">珍藏系列</li>
                        <li data-series="年份系列">年份系列</li>
                        <li data-series="礼盒系列">礼盒系列</li>
                        <li data-series="便携系列">便携系列</li>
                        <li data-series="典藏系列">典藏系列</li>
                    </ul>
                </div>
                <div class="filter-group">
                    <h4>价格区间</h4>
                    <ul class="filter-list" id="priceFilter">
                        <li class="active" data-price="all">全部价格</li>
                        <li data-price="0-200">¥200 以下</li>
                        <li data-price="200-500">¥200 - ¥500</li>
                        <li data-price="500-1000">¥500 - ¥1000</li>
                        <li data-price="1000-99999">¥1000 以上</li>
                    </ul>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main class="products-main">
                <div class="toolbar">
                    <div class="sort-tabs">
                        <a href="#" class="active" data-sort="default">综合</a>
                        <a href="#" data-sort="price-asc">价格 ↑</a>
                        <a href="#" data-sort="price-desc">价格 ↓</a>
                        <a href="#" data-sort="new">新品优先</a>
                    </div>
                    <div style="font-size:13px;color:var(--color-text-light);">
                        共 <span id="productCount" style="color:var(--color-primary);font-weight:bold;">0</span> 款产品
                    </div>
                </div>
                <div class="product-grid" id="productList"></div>
            </main>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/data.js?v=20261021"></script>
    <script src="js/products-live.js?v=20261021"></script>
    <script src="js/main.js?v=20261021"></script>
    <script>
        initPage('products');

        let filterState = { cat: 'all', series: 'all', price: 'all', sort: 'default' };

        // T1.1 live 化: 数据源优先 live 池(ProductsLive), 失败/未加载回落 data.js PRODUCTS
        function getSource() {
            return (window.ProductsLive && ProductsLive.get()) || PRODUCTS;
        }

        function renderList() {
            let list = getSource().filter(p => {
                if (filterState.cat !== 'all' && p.category !== filterState.cat) return false;
                if (filterState.series !== 'all' && p.series !== filterState.series) return false;
                if (filterState.price !== 'all') {
                    const [min, max] = filterState.price.split('-').map(Number);
                    if (p.price < min || p.price > max) return false;
                }
                // 搜索关键字
                const kw = getQueryParam('keyword');
                if (kw && !p.name.includes(kw) && !p.desc.includes(kw)) return false;
                return true;
            });

            // 排序('新品'判定兼容 mock tag 与 live isNew)
            if (filterState.sort === 'price-asc') list.sort((a, b) => a.price - b.price);
            else if (filterState.sort === 'price-desc') list.sort((a, b) => b.price - a.price);
            else if (filterState.sort === 'new') list.sort((a, b) => ((b.isNew || b.tag === '新品') ? 1 : 0) - ((a.isNew || a.tag === '新品') ? 1 : 0));

            document.getElementById('productCount').textContent = list.length;
            document.getElementById('productList').innerHTML = list.length
                ? list.map(renderProductCard).join('')
                : '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--color-text-light);">暂无符合条件的产品 🌿</div>';
        }

        // 绑定筛选事件
        function bindFilter(selector, key) {
            document.querySelectorAll(`${selector} li`).forEach(li => {
                li.addEventListener('click', () => {
                    document.querySelectorAll(`${selector} li`).forEach(x => x.classList.remove('active'));
                    li.classList.add('active');
                    filterState[key] = li.dataset[key === 'cat' ? 'cat' : key === 'series' ? 'series' : 'price'];
                    renderList();
                });
            });
        }
        bindFilter('#categoryFilter', 'cat');
        bindFilter('#seriesFilter', 'series');
        bindFilter('#priceFilter', 'price');

        document.querySelectorAll('.sort-tabs a').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('.sort-tabs a').forEach(x => x.classList.remove('active'));
                a.classList.add('active');
                filterState.sort = a.dataset.sort;
                renderList();
            });
        });

        renderList();

        // T1.1: 异步拉取 live 数据, 成功后重渲染(失败静默保持上方 mock 渲染)
        if (window.ProductsLive) ProductsLive.load(renderList);

        // 图片同步(2026-10-19): 与手机商城全部商品同源同图——按名称关键词
        // 匹配商城 API 商品图注入卡片; 未匹配保留原 CSS 酒瓶兜底
        (function () {
            let mallImgMap = null;
            const toks = n => (n || '').replace(/竹奕|竹香|·/g, ' ')
                .split(/[\s°()0-9a-zA-Z×批次年]+/).filter(t => t.length >= 2);
            function apply() {
                if (!mallImgMap) return;
                document.querySelectorAll('#productList .product-card').forEach(card => {
                    if (card.dataset.imgApplied) return;
                    const nm = (card.querySelector('.product-name') || {}).textContent || '';
                    let hit = null;
                    toks(nm).forEach(t => { if (!hit && mallImgMap[t]) hit = mallImgMap[t]; });
                    if (!hit) return;
                    const box = card.querySelector('.product-img');
                    if (box && !box.querySelector('img')) {
                        card.dataset.imgApplied = '1';
                        const im = document.createElement('img');
                        im.src = hit; im.alt = nm; im.loading = 'lazy';
                        im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
                        box.appendChild(im);
                    }
                });
            }
            fetch('/api/product/list?page=1&pageSize=50').then(r => r.json()).then(d => {
                mallImgMap = {};
                (d.products || []).forEach(p => {
                    const img = p.image || '';
                    if (!img) return;
                    toks(p.name).forEach(t => { if (!mallImgMap[t]) mallImgMap[t] = img; });
                });
                apply();
            }).catch(() => { });
            // 筛选/排序/live 池重渲染后自动补图
            new MutationObserver(apply).observe(document.getElementById('productList'), { childList: true });
        })();

        // 移动端筛选折叠 v2(2026-10-21): 点"筛选"展开面板; **选定任一筛选项后自动收起**——
        // 商品结果立即回到视口(修复展开态面板霸屏, 用户点系列后仍看不到结果的交互闭环缺陷)
        (function () {
            var btn = document.getElementById('filterToggle');
            var sb = document.querySelector('.sidebar');
            function collapse() {
                sb.classList.remove('expanded');
                btn.textContent = '筛选 ▾';
            }
            if (btn && sb) {
                btn.addEventListener('click', function () {
                    var open = sb.classList.toggle('expanded');
                    btn.textContent = open ? '收起筛选 ▴' : '筛选 ▾';
                });
                document.addEventListener('click', function (e) {
                    var t = e.target;
                    var li = t && t.closest ? t.closest('.filter-list li') : null;
                    if (li && sb.classList.contains('expanded') && window.innerWidth <= 768) {
                        collapse();
                    }
                });
            }
        })();
    </script>
</body>
</html>
