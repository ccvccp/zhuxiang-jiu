<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>小竹智能语音精灵 · 竹香网</title>
<style>
:root{--green:#2f7d52;--green-deep:#1d5a39;--green-soft:#e8f4ec;
      --gold:#c98a2d;--tx:#1f2d3d;--tx2:#6b7a8d;--bd:#dfe7e2;
      --card:#fff;--bg:#f4f7f5;--red:#b5453c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:
     var(--bg);color:var(--tx);display:flex;flex-direction:column;
     align-items:center;transition:background .6s ease;
     height:100dvh;overflow:hidden;padding:12px 12px 0}
body[data-bg="sunny"]{background:linear-gradient(165deg,#fdf6e3,#eaf4ec)}
body[data-bg="rainy"]{background:linear-gradient(165deg,#dfe7ef,#c9d6e2)}
body[data-bg="snowy"]{background:linear-gradient(165deg,#eef4fa,#dbe7f0)}
body[data-bg="foggy"]{background:linear-gradient(165deg,#eceff1,#dfe4e8)}
body[data-bg="cloudy"]{background:linear-gradient(165deg,#eef1f2,#e2e8ea)}
body[data-bg="festival"]{background:linear-gradient(165deg,#f9e8dc,#f3d9c4)}
body[data-bg="night"]{background:linear-gradient(165deg,#1c2b3b,#16222f)}
body[data-bg="night"] .footer,body[data-bg="night"] .hint{color:#8fa3b8}
.wrap{width:100%;max-width:680px;display:flex;flex-direction:column;
      flex:1;min-height:0}
h1{font-size:16px;text-align:center;color:var(--green-deep);margin-bottom:8px}
h1 small{display:block;font-size:11px;color:var(--tx2);font-weight:400;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;
      padding:18px 20px;margin-bottom:12px}
.hidden{display:none!important}
/* ---- 登录卡 ---- */
.card input{width:100%;height:44px;padding:0 12px;border:1px solid var(--bd);
      border-radius:8px;font-size:14px;margin-bottom:10px;
      -webkit-appearance:none;appearance:none}
.btn{display:inline-block;padding:10px 18px;border:none;border-radius:8px;
      background:var(--green);color:#fff;font-size:14px;cursor:pointer;
      transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--green-soft);color:var(--green-deep)}
.btn.gold{background:var(--gold)}
.hint{font-size:12px;color:var(--tx2);line-height:1.8}
/* ---- 情景条(紧凑) ---- */
.scene{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      background:var(--card);border:1px solid var(--bd);border-radius:12px;
      padding:9px 14px;margin-bottom:8px;font-size:12px;color:var(--tx2)}
.scene .greet{font-size:13.5px;font-weight:600;color:var(--green-deep);
      flex-basis:100%;line-height:1.45;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.scene .w-ico{display:inline-block;width:20px;height:20px;border-radius:6px;
      background:var(--green-soft);text-align:center;line-height:20px;flex-shrink:0}
.pill{display:inline-block;padding:1px 10px;border-radius:10px;
      font-size:11px;font-weight:600;background:var(--green-soft);
      color:var(--green-deep)}
.pill.gray{background:#eef1f4;color:var(--tx2)}
.pill.gold{background:#f7ecd9;color:var(--gold)}
.pill.wake-on{animation:wakep 2.4s ease-in-out infinite}
@keyframes wakep{0%,100%{box-shadow:0 0 0 0 rgba(47,125,82,.25)}
      50%{box-shadow:0 0 0 5px rgba(47,125,82,0)}}
/* ---- 会话条(紧凑) ---- */
.sbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
      background:var(--card);border:1px solid var(--bd);border-radius:12px;
      padding:8px 14px;margin-bottom:8px;font-size:12px;color:var(--tx2)}
.sbar b{color:var(--green-deep)}
.sbar .sp{flex:1}
.sbtn{padding:4px 12px;border-radius:6px;border:1px solid var(--bd);
      background:#fff;color:var(--tx);font-size:12px;cursor:pointer;
      transition:border-color .15s}
.sbtn:hover{border-color:var(--green);color:var(--green-deep)}
/* ---- 主区: 全屏聊天布局 ---- */
#main{display:flex;flex-direction:column;flex:1;min-height:0}
/* ---- 消息流 ---- */
.chat{flex:1;min-height:120px;background:var(--card);border:1px solid var(--bd);
      border-radius:12px;padding:16px;overflow-y:auto;overscroll-behavior:contain;
      margin-bottom:8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:#c8d4cd;border-radius:3px}
.chat::-webkit-scrollbar-track{background:transparent}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg{display:flex;margin-bottom:14px;animation:msgin .25s ease}
.msg.user{justify-content:flex-end}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,#3a9664,#1d5a39);color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;font-weight:600;box-shadow:0 2px 6px rgba(29,90,57,.25)}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;
      font-size:14px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:var(--green);color:#fff;border-top-right-radius:4px}
.msg.bot .bubble{background:var(--green-soft);color:var(--tx);
      border-top-left-radius:4px;margin-left:8px;position:relative}
.msg.err .bubble{background:#fbeeec;color:var(--red)}
/* TTS 播报中指示(点击气泡可停止播报) */
.bubble.speaking{box-shadow:0 0 0 2px rgba(201,138,45,.55);cursor:pointer}
.bubble.speaking::after{content:"🔊 播报中";position:absolute;top:-9px;
      right:10px;font-size:10px;background:var(--gold);color:#fff;
      padding:1px 8px;border-radius:8px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.5}}
.badges{margin-top:6px;font-size:10.5px;color:var(--tx2);display:flex;
      align-items:center;gap:4px;flex-wrap:wrap}
.badges .pill{margin:0}
.badges .t{margin-left:auto;letter-spacing:.5px}
.msg.user .badges .t{color:rgba(255,255,255,.75)}
.wakewarn{margin-top:6px;font-size:12px;color:var(--gold)}
/* 思考中指示 */
.typing{display:inline-flex;gap:4px;align-items:center;height:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--green);
      animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.35}
      30%{transform:translateY(-5px);opacity:1}}
/* ---- 引导卡(空态) ---- */
.guide{margin:6px 0 12px 42px;padding:14px;border:1.5px dashed #bcd4c5;
      border-radius:12px;text-align:center;animation:msgin .25s ease}
.guide .gt{font-size:12.5px;color:var(--tx2);margin-bottom:10px}
.guide .grow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gbtn{padding:8px 14px;border-radius:8px;background:var(--green-soft);
      color:var(--green-deep);font-size:13px;cursor:pointer;border:none;
      transition:background .15s}
.gbtn:hover{background:#d5eadf}
.gbtn:active{background:#c8e3d2}
/* ---- 卡片 ---- */
.kcard{margin-top:10px;background:#fff;border:1px solid var(--bd);
      border-radius:10px;padding:10px 12px;font-size:13px}
.kcard .ttl{font-weight:600;color:var(--green-deep);margin-bottom:6px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 4px;
      border-bottom:1px dashed var(--bd);font-size:13px}
.prow:last-child{border-bottom:none}
.prow .nm{flex:1}
.prow .pr{color:var(--red);font-weight:600}
.prow .pr small{color:var(--tx2);font-weight:400}
.jumpline{margin:2px 0 14px 42px}
.jumpbtn{display:inline-block;padding:5px 14px;
      border-radius:6px;background:var(--gold);color:#fff;
      font-size:12.5px;cursor:pointer;text-decoration:none;
      box-shadow:0 2px 6px rgba(201,138,45,.3)}
.jumpbtn:hover{filter:brightness(1.08)}
/* ---- 确认码分格 ---- */
.confirmbox{margin-top:10px;background:#fff;border:1px solid var(--gold);
      border-radius:10px;padding:12px}
.confirmbox .ct{font-weight:600;color:var(--gold);margin-bottom:4px}
.confirmbox .cs{font-size:12.5px;color:var(--tx2);margin-bottom:10px;line-height:1.7}
.ccells{display:flex;gap:8px;margin-bottom:10px}
.ccell{width:46px;height:52px;border:1.5px solid var(--bd);border-radius:8px;
      text-align:center;font-size:22px;font-weight:700;color:var(--green-deep);
      background:#fff;caret-color:var(--gold)}
.ccell:focus{border-color:var(--gold);outline:none;
      box-shadow:0 0 0 3px rgba(201,138,45,.15)}
.ccell.filled{border-color:var(--green);background:var(--green-soft)}
/* ---- 快捷指令(单行横滑) ---- */
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;
      margin-bottom:8px;padding:2px 2px 6px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 92%,transparent);
      -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:14px;background:var(--card);
      border:1px solid var(--bd);font-size:12px;color:var(--green-deep);
      cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--green);background:var(--green-soft)}
.chip:active{transform:scale(.96)}
/* ---- 输入区(常驻底部) ---- */
.composer{position:relative;background:var(--card);border:1px solid var(--bd);
      border-radius:12px;padding:12px 16px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom))}
/* 回到最新(消息流离底时浮现) */
.downbtn{position:absolute;top:-46px;right:14px;width:36px;height:36px;
      border-radius:50%;border:1px solid var(--bd);background:var(--card);
      color:var(--green-deep);font-size:15px;cursor:pointer;display:none;
      box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:5}
.downbtn.show{display:block;animation:msgin .2s ease}
.modes{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;border:none;background:#fff;font-size:12px;
      color:var(--tx2);cursor:pointer;transition:all .15s}
.seg button.on{background:var(--green);color:#fff}
.modes .sp{flex:1}
.tts{font-size:12px;color:var(--tx2);cursor:pointer;user-select:none;
      padding:4px 8px;border-radius:6px}
.tts:hover{background:var(--green-soft)}
.microw{display:flex;align-items:center;gap:14px}
.mic{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
      background:var(--green);color:#fff;font-size:24px;flex-shrink:0;
      box-shadow:0 4px 12px rgba(47,125,82,.35);position:relative;
      display:flex;align-items:center;justify-content:center;
      transition:background .2s;touch-action:none;user-select:none;
      -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
.mic.off{background:#b8c4bd;box-shadow:none;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(181,69,60,.45)}
      70%{box-shadow:0 0 0 16px rgba(181,69,60,0)}
      100%{box-shadow:0 0 0 0 rgba(181,69,60,0)}}
.mic:active{transform:scale(.95)}
.micside{flex:1;min-width:0}
.wave{display:none;align-items:center;gap:3px;height:24px}
.wave.show{display:flex}
.wave i{width:3px;background:var(--green);border-radius:2px;
      animation:wv 1s ease-in-out infinite}
.wave i:nth-child(1){height:7px;animation-delay:0s}
.wave i:nth-child(2){height:15px;animation-delay:.12s}
.wave i:nth-child(3){height:22px;animation-delay:.24s}
.wave i:nth-child(4){height:12px;animation-delay:.36s}
.wave i:nth-child(5){height:20px;animation-delay:.48s}
.wave i:nth-child(6){height:9px;animation-delay:.6s}
.wave i:nth-child(7){height:17px;animation-delay:.72s}
.wave i:nth-child(8){height:11px;animation-delay:.84s}
.wave.red i{background:var(--red)}
/* 真实音量驱动态(云端录音 AnalyserNode RMS → --amp) */
.wave.live i{animation:none;transform:scaleY(var(--amp,.3))}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.status{font-size:12px;color:var(--tx2);line-height:1.6;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--green-deep)}
.status .rec{color:var(--red);font-variant-numeric:tabular-nums}
.interim{margin-top:4px;font-size:13.5px;color:var(--tx);min-height:20px;
      line-height:1.5}
.interim b{color:var(--gold)}
.trow{display:flex;gap:10px;margin-top:10px}
.trow input{flex:1;height:44px;padding:0 12px;border:1px solid var(--bd);
      border-radius:8px;font-size:14px;transition:border-color .15s;
      -webkit-appearance:none;appearance:none}
.trow input:focus{border-color:var(--green);outline:none}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);
      background:rgba(31,45,61,.92);color:#fff;padding:9px 20px;
      border-radius:8px;font-size:13px;display:none;z-index:99;
      box-shadow:0 4px 16px rgba(0,0,0,.25)}
.footer{font-size:10.5px;color:var(--tx2);text-align:center;
      line-height:1.7;margin:6px 0 8px;padding:0 10px;flex-shrink:0}
@media (max-width:480px){
  .mic{width:54px;height:54px;font-size:21px}
  .bubble{max-width:84%;font-size:13.5px}
  .scene .greet{font-size:13px}
  .guide .grow{flex-direction:column}
  .ccell{width:42px;height:48px}
}
/* 矮视口兜底(横屏/小窗): 收缩非关键区防溢出 */
@media (max-height:560px){
  .guide{display:none}
  .footer{display:none}
  h1 small{display:none}
  .scene{padding:6px 12px}
  .chat{min-height:80px}
  .mic{width:46px;height:46px;font-size:18px}
  .composer{padding:8px 14px}
}
/* embed 模式(全站浮层iframe): 隐藏页脚声明省空间 */
body.embed .footer{display:none}
/* iOS 触屏输入修复: 字号≥16px 防 Safari 聚焦自动缩放(输入框视觉"异常变大"根因) */
@media (hover:none) and (pointer:coarse){
  .trow input,.card input{font-size:16px}
  .ccell{font-size:22px}
}
/* 软键盘弹起态(VV 适配 JS 加 .kb): 释放 safe-area 底部增量防 composer 异常增高 */
body.kb .composer{padding-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>小竹智能语音精灵<small>说一句话 · 完成所有操作</small></h1>

<!-- 登录卡 -->
<div class="card" id="loginCard">
  <div style="font-size:14px;font-weight:600;color:var(--green-deep);margin-bottom:12px">登录后开启语音会话</div>
  <input id="phone" placeholder="手机号" maxlength="11" inputmode="numeric">
  <input id="pwd" type="password" placeholder="密码">
  <button class="btn" id="loginBtn" onclick="doLogin()" style="width:100%">登录</button>
  <button class="btn ghost" onclick="quickFill()" style="width:100%;margin-top:8px">体验账号快捷填充</button>
  <div class="hint" style="margin-top:10px">语音会话需登录（生产 strict 鉴权）；未登录可浏览页面框架与情景问候。</div>
</div>

<!-- 主区 -->
<div id="main" class="hidden">
  <div class="scene">
    <div class="greet" id="greet">正在感知您的时空情景…</div>
    <span class="w-ico" id="wico">🌡</span><span id="weather">…</span>
    <span class="pill gray" id="ctxLevel">—</span>
    <span class="pill gray" id="ctxBind">—</span>
  </div>

  <div class="sbar">
    <span>会话 <b id="sid">…</b></span>
    <span>轮次 <b id="tcount">0</b></span>
    <span class="pill gray" id="wakePill">待唤醒</span>
    <span class="pill gray" id="modePill">assist</span>
    <span class="sp"></span>
    <button class="sbtn" onclick="newSession()">新会话</button>
    <button class="sbtn" onclick="clearSession()">清除记录</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="chips" id="chips"></div>

  <div class="composer">
    <button class="downbtn" id="downBtn" title="回到最新" onclick="scrollChat()">↓</button>
    <div class="modes">
      <span class="tts" id="hfBtn" onclick="toggleHandfree()" style="cursor:pointer">🎧 免提开</span>
      <span class="sp"></span>
      <span class="tts" id="ttsBtn" onclick="toggleTts()" style="cursor:pointer">🔊 播报开</span>
    </div>
    <div class="microw">
      <button class="mic" id="mic" onclick="micClick()">🎤</button>
      <div class="micside">
        <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="status" id="micStatus">点击麦克风开始说话（需 HTTPS + 麦克风授权）</div>
        <div class="interim" id="interim"></div>
      </div>
    </div>
    <div class="trow">
      <input id="tinput" placeholder="或打字输入：小竹，看新品" onkeydown="if(event.key==='Enter')sendFromInput()">
      <button class="btn" id="sendBtn" onclick="sendFromInput()">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="footer">唤醒词「小竹」· 免唤醒窗口 5 分钟 · 音频即转即删不落库 · 身份证/手机号/卡号自动脱敏<br>
高敏操作双因子：语音确认 + 屏幕 4 位确认码（语音念码不算）</div>
</div>

<script>
/* ===== 精简 JWT 链(login → localStorage → apiFetch 401 自愈) ===== */
var AUTH_KEY = "zhuxiang.auth";
function getAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; }
}
function setAuth(a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function clearAuth() { localStorage.removeItem(AUTH_KEY); }

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(function () { t.style.display = "none"; }, 2400);
}

function doLogin() {
  var phone = document.getElementById("phone").value.trim();
  var pwd = document.getElementById("pwd").value;
  if (!phone || !pwd) { showToast("请输入手机号和密码"); return; }
  var btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "登录中…";
  fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phone: phone, password: pwd })
  }).then(function (r) { return r.json(); }).then(function (j) {
    btn.disabled = false; btn.textContent = "登录";
    var token = j && (j.accessToken || (j.data && j.data.accessToken));
    if (token) {
      setAuth({ token: token, refreshToken: j.refreshToken || (j.data && j.data.refreshToken) || "", uid: j.memberId || (j.data && j.data.memberId) || 0 });
      enterMain();
    } else {
      showToast((j && (j.error || j.detail)) || "登录失败");
    }
  }).catch(function () {
    btn.disabled = false; btn.textContent = "登录";
    showToast("网络异常, 请重试");
  });
}
function quickFill() {
  document.getElementById("phone").value = "13800000001";
  document.getElementById("pwd").value = "test123456";
}

/* apiFetch: 401 → refresh → retry 一次 */
function apiFetch(path, opts) {
  opts = opts || {};
  var auth = getAuth();
  var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (auth && auth.token) headers["Authorization"] = "Bearer " + auth.token;
  return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (r) {
    if (r.status === 401 && auth && auth.refreshToken && !opts.__retried) {
      return fetch("/api/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refreshToken: auth.refreshToken })
      }).then(function (r2) { return r2.json(); }).then(function (j2) {
        var nt = j2 && (j2.accessToken || (j2.data && j2.accessToken));
        if (nt) {
          setAuth(Object.assign(auth, { token: nt }));
          return apiFetch(path, Object.assign({}, opts, { __retried: true }));
        }
        clearAuth(); showLogin();
        throw new Error("登录已过期");
      });
    }
    return r.json();
  });
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function nowHM() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function weatherIcon(w) {
  w = w || "";
  if (w.indexOf("雪") >= 0) return "❄";
  if (w.indexOf("雨") >= 0) return "🌧";
  if (w.indexOf("雾") >= 0 || w.indexOf("霾") >= 0) return "🌫";
  if (w.indexOf("阴") >= 0) return "☁";
  if (w.indexOf("云") >= 0) return "⛅";
  if (w.indexOf("晴") >= 0) return "☀";
  return "🌡";
}

/* ===== 消息渲染 ===== */
function scrollChat() {

}
function appendUser(text, channel) {
  var c = document.getElementById("chat");
  var d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = '<div class="bubble">' + esc(text) +
    '<div class="badges"><span class="pill" style="background:rgba(255,255,255,.22);color:#fff">' +
    (channel === "voice" ? "🎤 语音" : "⌨ 文字") +
    '</span><span class="t">' + nowHM() + "</span></div></div>";
  c.appendChild(d); scrollChat();
}
function appendBot(reply, card, badgesHtml, extra, jump) {
  var c = document.getElementById("chat");
  var d = document.createElement("div");
  d.className = "msg bot" + (extra === "__err__" ? " err" : "");
  var h = '<div class="avatar">竹</div><div class="bubble">' + esc(reply || "");
  if (card) h += renderCard(card);
  h += '<div class="badges">' + (badgesHtml || "") +
    '<span class="t">' + nowHM() + "</span></div>";
  h += "</div>";
  d.innerHTML = h;
  c.appendChild(d);
  /* jump 独立消息行(气泡外——彻底脱离 bubble/kcard 布局,
     规避 X5 内核行盒重叠与 fit-content 兼容问题) */
  if (jump) {
    var jhref = esc(jump);
    var jl = document.createElement("div");
    jl.className = "jumpline";
    jl.innerHTML = (document.body.classList.contains("embed"))
      ? '<a class="jumpbtn" href="' + jhref
        + '" onclick="event.preventDefault();'
        + "window.parent.postMessage({type:'xz-jump',href:'"
        + jhref + "'},\'*\')\">前往查看 →</a>"
      : '<a class="jumpbtn" href="' + jhref
        + '">前往查看 →</a>';
    c.appendChild(jl);
  }
  scrollChat();
  return d.querySelector(".bubble");
}

/* 卡片渲染: product_list/product_detail/confirm/confirm_voice/通用 */
function renderCard(card) {
  var t = card.type || "";
  if (t === "product_list" || t === "product_detail") {
    var h = '<div class="kcard"><div class="ttl">🎋 ' + esc(card.subject || "商品") +
      (card.preferenceApplied ? ' <span class="pill gold">按您的偏好排序</span>' : "") + "</div>";
    (card.items || []).slice(0, 6).forEach(function (p) {
      h += '<div class="prow"><span class="nm">' + esc(p.name || p.productName || "商品") +
        '</span><span class="pr">¥' + esc(p.price) +
        (p.spec ? '<small> · ' + esc(p.spec) + "</small>" : "") + "</span></div>";
    });
    h += "</div>";
    return h;
  }
  if (t === "confirm") {
    var cells = '<div class="ccells">';
    for (var i = 0; i < 4; i++) {
      cells += '<input class="ccell" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="确认码第' + (i + 1) + '位">';
    }
    cells += "</div>";
    return '<div class="confirmbox"><div class="ct">🔐 高敏操作确认</div>' +
      '<div class="cs">' + esc(card.subject || "") + "<br>" + esc(card.codeHint || "请输入屏幕显示的 4 位确认码") +
      (card.consentPhrase ? '<br>语音确认短语：' + esc(card.consentPhrase) : "") +
      "</div>" + cells +
      '<button class="btn gold" data-cftoken="' + esc(card.confirmToken || "") + '">确认执行</button></div>';
  }
  if (t === "confirm_voice") {
    return '<div class="confirmbox"><div class="ct">🎙 语音确认已记录</div>' +
      '<div class="cs">' + esc(card.subject || "语音意图凭证已收到") + '——请在屏幕输入 4 位确认码完成双因子核验。</div></div>';
  }
  /* 通用卡片: 键值对 */
  var h = '<div class="kcard">';
  var n = 0;
  Object.keys(card).forEach(function (k) {
    if (k === "type") return;
    var v = card[k];
    if (v == null || typeof v === "object") return;
    h += '<div class="prow"><span class="nm">' + esc(k) + '</span><span class="pr"><small>' + esc(v) + "</small></span></div>";
    n++;
  });
  h += "</div>";
  return n ? h : "";
}

/* ===== 轮次响应处理(语音/文本同链) ===== */
function handleTurn(j, channel) {
  S.turnCount++;
  document.getElementById("tcount").textContent = S.turnCount;
  var badges = "";
  var tr = j.turn || {};
  if (tr.intent) badges += '<span class="pill gray">' + esc(tr.intent) + "</span>";
  if (j.track && j.track !== "rule") badges += '<span class="pill gray">轨:' + esc(j.track) + "</span>";
  if (tr.latencyMs) badges += '<span class="pill gray">' + esc(tr.latencyMs) + "ms</span>";
  if (j.xiaoMode) { badges += '<span class="pill">' + esc(j.xiaoMode) + "</span>"; document.getElementById("modePill").textContent = j.xiaoMode; }
  var wakeWarn = "";
  if (j.wakeHint) {
    wakeWarn = '<div class="wakewarn">💡 我在——请以「小竹」开头唤我（或先唤醒一次，5 分钟内可免唤醒连续对话）</div>';
    S.woken = false;
  } else if (tr.wake) {
    S.woken = true;
  }
  var bubble = appendBot(j.reply || "(无应答)", j.card || null, badges + wakeWarn,
                         null, j.autoJump ? null : (j.jump || null));
  if (j.fallbackHint === "keyboard") {
    appendBot("语音转写未成功——可用下方文字输入继续（同一条链路）。", null, '<span class="pill gray">ASR 降级</span>');
  }
  if (j.clarify) {
    appendBot("（需要补充信息：请直接回复补全后重试）", null, '<span class="pill gray">clarify</span>');
  }
  updateWakePill();
  speak(j.reply || "", bubble);
  /* 语音跟随跳转(page.goto): 播报"正在打开"后自动导航
     ——浮层 postMessage 请求父窗口跳, 独立页直接跳
     跳转前保存聊天状态(sessionStorage 同 tab 存活,
     主窗口导航后浮层重载可恢复会话与消息) */
  if (j.autoJump && j.jump) {
    var gotoHref = j.jump;
    saveChatState();
    setTimeout(function () {
      if (document.body.classList.contains("embed")) {
        window.parent.postMessage(
          { type: "xz-jump", href: gotoHref }, "*");
      } else {
        window.location.href = gotoHref;
      }
    }, 1600);
  }
  /* 交易类回复自动弹回全屏(mini 小条看不清加购了什么——
     用户不敢下单; 看清卡片再决定结算) */
  if (document.body.classList.contains("embed")
      && { "cart.add": 1, "cart.submit": 1,
           "order.pay": 1 }[(j.turn || {}).intent]) {
    try {
      window.parent.postMessage(
        { type: "xz-panel-maximize" }, "*");
    } catch (e) { /* 跨域兜底(理论不达) */ }
  }
}
/* 聊天状态保存/恢复(跨页面跳转——浮层 iframe 随主窗口
   导航销毁重建, sessionStorage 同 tab 存活用于恢复) */
function saveChatState() {
  try {
    sessionStorage.setItem("xz.chat",
      document.getElementById("chat").innerHTML);
    sessionStorage.setItem("xz.sid", S.sid || "");
  } catch (e) { /* 隐私模式等存储失败——跳过恢复 */ }
}
function tryRestoreChat() {
  try {
    var sid = sessionStorage.getItem("xz.sid");
    var html = sessionStorage.getItem("xz.chat");
    if (sid && html) {
      S.sid = sid;
      document.getElementById("sid").textContent = "#" + sid;
      document.getElementById("chat").innerHTML = html;
      document.getElementById("mic").classList.remove("off");
      appendBot("已恢复对话——继续说即可（语音球全程在线）",
                null, "会话恢复 #" + sid);
      /* 恢复后滚到底部(最新消息含前往查看按钮) */
      scrollChat();
      setTimeout(scrollChat, 350);
      return true;
    }
  } catch (e) { /* 恢复失败走新会话 */ }
  return false;
}
function turnError(e) {
  appendBot("⚠️ 请求失败：" + (e && e.message ? e.message : "网络/服务异常"), null, null, "__err__");
}

/* ===== 发送: 文本/云端音频 ===== */
function setPending(on) {
  S.pending = on;
  var b = document.getElementById("sendBtn");
  b.disabled = on;
  b.textContent = on ? "…" : "发送";
  document.getElementById("mic").classList.toggle("off", on || !S.sid);
}
function sendFromInput() {
  var inp = document.getElementById("tinput");
  var text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  sendText(text);
}
function sendText(text) {
  if (!S.sid || S.pending) { showToast(S.pending ? "上一轮处理中…" : "会话未开启"); return; }
  appendUser(text, "text");
  setPending(true);
  showTyping();
  apiFetch("/api/xiaozhu/sessions/" + S.sid + "/text", {
    method: "POST", body: JSON.stringify({ text: text })
  }).then(function (j) {
    setPending(false); removeTyping();
    if (!j || j.success === false) { appendBot((j && (j.error || j.detail)) || "指令失败", null, null, "__err__"); return; }
    handleTurn(j, "text");
  }).catch(function (e) { setPending(false); removeTyping(); turnError(e); });
}
function sendVoice(b64, durationSec) {
  if (!S.sid) { showToast("会话未开启"); return; }
  setPending(true);
  setMicStatus("☁ 云端识别中…（音频即转即删）");
  apiFetch("/api/xiaozhu/sessions/" + S.sid + "/voice", {
    method: "POST",
    body: JSON.stringify({ audioBase64: b64, filename: "audio.wav", durationSec: Math.round(durationSec * 10) / 10 })
  }).then(function (j) {
    setPending(false); removeTyping();
    setMicStatus("云端识别完成");
    if (!j || j.success === false) { appendBot((j && (j.error || j.detail)) || "语音链路失败", null, null, "__err__"); return; }
    var rt = (j.turn || {}).rawText || "";
    if (isEchoOfTTS(rt)) {
      /* TTS 回声(免提麦克风录到自己播报——微信真机 AEC
         不覆盖 speechSynthesis, 留痕实证"还不会"6连回环):
         静默丢弃防"播报→录回→再回复"无限循环 */
      appendUser("(自己播报的回声，已忽略)", "voice");
      scheduleHandfree(400);
      return;
    }
    appendUser(rt || "(语音)", "voice");
    handleTurn(j, "voice");
  }).catch(function (e) { setPending(false); removeTyping(); setMicStatus("云端识别失败"); turnError(e); scheduleHandfree(1200); });
}
/* TTS 回声判定: 转写为最近播报文本的子串(归一化去标点;
   限 2-12 字——长转写几乎不可能是纯回声, 防误杀) */
function isEchoOfTTS(t) {
  var last = S.lastSpoken || "";
  if (!last || !t) return false;
  var norm = function (s) {
    return String(s).replace(
      /[\s，。？！、,.?!:：；;「」『』（）()\-—…·]/g, "");
  };
  var a = norm(t), b = norm(last);
  return a.length >= 2 && a.length <= 12 && b.indexOf(a) >= 0;
}

/* ===== 确认码分格输入 + 核销(POST /api/xiaozhu/confirm/{token}) ===== */
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t.classList || !t.classList.contains("ccell")) return;
  t.value = t.value.replace(/\D/g, "").slice(-1);
  t.classList.toggle("filled", !!t.value);
  if (t.value) {
    var n = t.nextElementSibling;
    if (n && n.classList.contains("ccell")) n.focus();
  }
});
document.addEventListener("keydown", function (ev) {
  var t = ev.target;
  if (!t.classList || !t.classList.contains("ccell")) return;
  if (ev.key === "Backspace" && !t.value) {
    var p = t.previousElementSibling;
    if (p && p.classList.contains("ccell")) {
      p.focus(); p.value = ""; p.classList.remove("filled");
      ev.preventDefault();
    }
  }
});
document.addEventListener("click", function (ev) {
  var b = ev.target && ev.target.closest ? ev.target.closest("[data-cftoken]") : null;
  if (b) doConfirm(b);
});
/* TTS 播报中: 点击气泡立即停止播报 */
document.addEventListener("click", function (ev) {
  var b = ev.target && ev.target.closest ? ev.target.closest(".bubble.speaking") : null;
  if (b && window.speechSynthesis) {
    window.speechSynthesis.cancel();
    b.classList.remove("speaking");
    showToast("已停止播报");
  }
});
/* 消息流离底浮现"回到最新" */
document.getElementById("chat").addEventListener("scroll", function () {
  var away = this.scrollHeight - this.scrollTop - this.clientHeight > 100;
  document.getElementById("downBtn").classList.toggle("show", away && S.turnCount > 2);
});
function doConfirm(btn) {
  var box = btn.closest(".confirmbox");
  var cells = box ? box.querySelectorAll(".ccell") : [];
  var code = "";
  for (var i = 0; i < cells.length; i++) code += cells[i].value || "";
  if (!/^\d{4}$/.test(code)) {
    showToast("请输入完整 4 位数字确认码");
    if (cells.length) cells[0].focus();
    return;
  }

    u.onend = done;

  var off = 44;
  for (var k = 0; k < len; k++, off += 2) {
    var s2 = Math.max(-1, Math.min(1, data[k]));
    v.setInt16(off, s2 < 0 ? s2 * 0x8000 : s2 * 0x7FFF, true);
  }
  return buf;
}
function arrayBufferToBase64(buf) {
  var b = new Uint8Array(buf), s = "";
  for (var i = 0; i < b.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  }
  return btoa(s);
}

/* ===== iOS/移动端键盘适配: visualViewport 实时跟随 =====
   iOS Safari 软键盘弹起不改 layout viewport——100dvh 布局下输入框
   会被键盘遮挡/挤压异常。以 VV 高度实时收紧 body, 并标记 .kb 态
   释放 composer 的 safe-area 底部增量。 */
(function () {
  var vv = window.visualViewport;
  if (!vv) return;
  var fit = function () {
    document.body.style.height = Math.round(vv.height) + "px";
    /* 键盘弹起判定: 视觉视口显著小于布局视口 */
    document.body.classList.toggle("kb", vv.height < window.innerHeight * 0.78);
    if (document.activeElement && document.activeElement.tagName === "INPUT") {
      setTimeout(scrollChat, 60);
    }
  };
  vv.addEventListener("resize", fit);
  fit();
})();
/* 输入框聚焦: 键盘弹起动画后消息流滚到底(保持输入框可见) */
document.addEventListener("focusin", function (ev) {
  if (ev.target && ev.target.tagName === "INPUT") {
    setTimeout(scrollChat, 350);
  }
});

/* ===== 启动 ===== */
(function () {
  /* 默认云端识别(自有智谱ASR链路, 国内可用);
     浏览器识别依赖厂商云端服务(Chrome→Google), 国内网络普遍不可达, 降级为用户主动选择 */
  setMode("cloud");
  /* embed 模式(全站浮层 iframe): 隐藏页脚声明, jump 导航父窗口(主站) */
  if (/[?&]embed=1/.test(location.search)) {
    document.body.classList.add("embed");
  }
  var auth = getAuth();
  if (auth && auth.token) enterMain(); else showLogin();
})();
</script>
