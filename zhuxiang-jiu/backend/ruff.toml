# ruff 配置: 聚焦真实代码质量问题(语法错误 + pyflakes)
# 不强制代码风格(项目无统一风格, 避免噪音)
# CI 质量门禁: ruff check . 退出码 0 = 通过

target-version = "py312"
line-length = 120  # 宽松, 仅警告不强制修正

# 第三方依赖 + 工具目录(顶层数组, 必须在 [lint] 表之前)
exclude = [
    ".lint_libs",
    ".deps",
    "site-packages",
    "node_modules",
    "__pycache__",
    ".pytest_cache",
    "htmlcov",
    "dist",
    "build",
    ".eggs",
]

[lint]
# E9 = 语法错误(IndentationError/SyntaxError 等)
# F = pyflakes:
#   F401 未使用导入
#   F821 未定义变量
#   F811 重定义
#   F841 未使用局部变量
# UP = pyupgrade: 现代化语法(Optional[X]→X|None, List→list, StrEnum 等)
# B = bugbear: 常见 bug 模式(B904 raise缺from, B007 未使用循环变量)
# SIM = 简化(SIM105 suppress, SIM102 合并if, SIM108 三元, SIM117 with合并)
# RUF012 = 可变类默认值
# RUF015 = 不必要的可迭代分配
# RUF100 = 无用的 noqa 注释
select = ["E9", "F", "UP", "B", "SIM", "RUF012", "RUF015", "RUF100"]

[lint.per-file-ignores]
# 测试文件允许未使用导入(常量导入是测试风格, 不阻断)
"test_*.py" = ["F401"]
# conftest.py 的 fixture 可能被其他文件引用
"conftest.py" = ["F401"]
# *_smoke.py 冒烟测试允许未使用导入
"*_smoke.py" = ["F401"]
# routes 的 FastAPI Depends() 是标准模式, B008 误报
"routes/*.py" = ["B008"]
# services 的 Repository() 构造默认值是项目模式, B008 误报
"services/*.py" = ["B008"]
