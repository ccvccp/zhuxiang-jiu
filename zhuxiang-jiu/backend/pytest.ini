[pytest]
# AI决策筹划模块(29) pytest 配置
# 运行: pytest (自动发现 test_*.py 中的 Test* 类和 test_* 函数)

minversion = 8.0

# pytest-asyncio: auto 模式自动处理 async 测试和 fixtures
asyncio_mode = auto

# 测试文件搜索路径
testpaths = .

# 测试文件/类/函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认运行选项
# -v: 详细输出  --tb=short: 简短回溯  --strict-markers: 严格标记
# --color=yes: 彩色输出  -ra: 显示跳过/预期失败摘要
addopts = -v --tb=short --strict-markers --color=yes -ra

# 自定义标记注册(--strict-markers 要求显式注册)
markers =
    redis: 需 Redis 服务的集成测试(无 Redis 时自动跳过)

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
