[pytest]
# AI决策筹划模块(29) pytest 配置
# 运行: pytest (自动发现 test_*.py 中的 Test* 类和 test_* 函数)

minversion = 8.0

# 测试文件搜索路径
testpaths = .

# 测试文件/类/函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认运行选项
# -v: 详细输出  --tb=short: 简短回溯  --strict-markers: 严格标记
# --color=yes: 彩色输出  -ra: 显示跳过/预期失败摘要
addopts = -v --tb=short --strict-markers --color=yes -ra

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# pytest-asyncio 配置
# auto: 自动识别 async def test_* 函数,无需 @pytest.mark.asyncio 装饰器
asyncio_mode = auto

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
