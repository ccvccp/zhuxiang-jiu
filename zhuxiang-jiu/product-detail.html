<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="var(--color-primary-dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>产品详情 - 竹香酒 · 竹奕系列</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html">首页</a><span>/</span>
            <a href="products.html">酒类介绍</a><span>/</span>
            <span id="crumbName">产品详情</span>
        </div>

        <div class="product-detail" id="productDetail"></div>

        <!-- 产品详情描述 -->
        <section class="section" style="background:var(--color-white);border-radius:16px;padding:40px;margin-bottom:30px;">
            <div class="section-title">
                <h2>产品<span>详情</span></h2>
                <div class="deco-line"></div>
            </div>
            <div id="productDesc" style="max-width:800px;margin:0 auto;line-height:2;color:var(--color-text);"></div>
        </section>

        <!-- 75号·竹韵·智衡 知识内核联动(游客白名单 GET /api/zyh/knowledge) -->
        <section class="section" style="background:var(--color-white);border-radius:16px;padding:40px;margin-bottom:30px;">
            <div class="section-title">
                <h2>竹酒<span>知识内核</span></h2>
                <div class="deco-line"></div>
            </div>
            <div id="zyhKnowledge" style="max-width:800px;margin:0 auto;color:var(--color-text);">
                <p style="color:var(--color-muted);font-size:14px;">加载中…（75号·竹韵·智衡 事实锚点）</p>
            </div>
            <div style="text-align:center;margin-top:24px;">
                <a href="zyh.html" style="display:inline-block;padding:10px 28px;border-radius:22px;
                    background:var(--color-primary,var(--color-primary-dark));color:var(--color-white);text-decoration:none;font-size:14px;">
                    🎋 问竹韵·智衡（工艺 / 香型 / 竞品对比）
                </a>
                <p style="font-size:11px;color:#aaa;margin-top:8px;">
                    智能问答经守门三层（L1 正则 / L2 分类 / L3 溯源）应答 · 健康警示：过量饮酒有害健康
                </p>
            </div>
        </section>

        <!-- 相关推荐 -->
        <section class="section">
            <div class="section-title">
                <h2>相关<span>推荐</span></h2>
                <div class="deco-line"></div>
            </div>
            <div class="product-grid" id="relatedProducts"></div>
        </section>
    </div>

    <div id="footer"></div>

    <script src="js/data.js?v=20261021b"></script>
    <script src="js/products-live.js?v=20261021"></script>
    <script src="js/main.js?v=20261021b"></script>
    <script>
        initPage('products');

        // T1.2 双轨 id: 非纯数字 = live SKU(如 ZX42-2026B01) → 异步详情替换; 纯数字/空 = mock(data.js)
        const rawId = getQueryParam('id');
        const liveSku = rawId && !/^\d+$/.test(rawId) ? rawId : null;
        let product = PRODUCTS.find(p => p.id === (parseInt(rawId) || 1)) || PRODUCTS[0];

        // 渲染主入口(mock 与 live 共用同一模板, 版式同构)
        function renderAll(p, relatedArr) {
            document.getElementById('crumbName').textContent = p.name;
            document.title = `${p.name} - 竹香酒`;

            // 渲染产品详情
            document.getElementById('productDetail').innerHTML = `
            <div>
                <div class="product-gallery">
                    <div class="bottle"></div>
                </div>
                <div class="gallery-thumbs">
                    <div class="thumb active">🍶</div>
                    <div class="thumb">📦</div>
                    <div class="thumb">🌿</div>
                    <div class="thumb">📋</div>
                </div>
            </div>
            <div class="product-info-detail">
                <h1>${p.name}</h1>
                <p class="product-subtitle">${p.desc}</p>
                <div class="product-meta">
                    <div class="product-meta-row"><label>香型：</label><span>${p.category}</span></div>
                    <div class="product-meta-row"><label>系列：</label><span>${p.series}</span></div>
                    <div class="product-meta-row"><label>酒精度：</label><span>${p.alcohol}</span></div>
                    <div class="product-meta-row"><label>净含量：</label><span>${p.volume}</span></div>
                    <div class="product-meta-row"><label>产地：</label><span>${p.origin}</span></div>
                </div>
                <div class="product-price-box">
                    <span class="price-now">¥${p.price}</span>
                    <span class="price-original">原价 ¥${p.originalPrice}</span>
                </div>
                <div class="spec-selector">
                    <h4>规格选择</h4>
                    <div class="spec-options">
                        <div class="spec active">${p.volume}</div>
                        <div class="spec">竹编礼盒装</div>
                        <div class="spec">整箱6瓶</div>
                    </div>
                </div>
                <div class="quantity-selector">
                    <h4>数量</h4>
                    <div class="qty-control">
                        <button onclick="changeQty(-1)">−</button>
                        <input type="text" id="qtyInput" value="1" readonly>
                        <button onclick="changeQty(1)">+</button>
                    </div>
                </div>
                <div class="product-actions">
                    <button class="btn btn-outline" onclick="Cart.add('${p.id}', parseInt(document.getElementById('qtyInput').value))">加入购物车</button>
                    <button class="btn btn-primary" onclick="buyNow('${p.id}')">立即购买</button>
                </div>
                <div class="product-services">
                    <span>正品保证</span>
                    <span>全国配送</span>
                    <span>破损包赔</span>
                    <span>7×24客服</span>
                    <span>发票支持</span>
                </div>
            </div>`;

            // 渲染产品描述(品牌固定文案 + 数据变量位)
            document.getElementById('productDesc').innerHTML = `
            <h3 style="text-align:center;margin-bottom:8px;color:var(--color-primary-dark);">🌿 全竹发酵 · 匠心之作</h3>
            <p style="text-align:center;margin-bottom:24px;color:var(--color-accent);font-size:18px;font-weight:bold;letter-spacing:1px;">福来竹奕香，鸿运随心走！</p>
            <p><strong>${p.name}</strong>，源自${p.origin}，是${p.series}中的精品之作。由山东瑞麒酒业有限公司出品，首创全竹发酵工艺，创新定义中国竹香酒。</p>
            <p>${p.desc}</p>
            <p>取武夷山新鲜楠竹笋及全竹为原料，汲取徂徕山"竹溪六逸"泉水，联合十余家科研机构独创生物发酵技术，将竹材转化为葡萄糖、木糖、甘露糖及多种多糖，再由专用酿酒酵母转化，最终成就竹奕酒。</p>
            <h4 style="margin:24px 0 12px;color:var(--color-primary-dark);">【品质密码】</h4>
            <p>🌿 <strong>竹叶黄酮(AOB)：</strong>天然竹叶提取物，国家批准的新食品原料，融入酒体。</p>
            <p>🔬 <strong>风味成分：</strong>自然转化出丁香醇、β-紫罗兰酮、γ-癸内酯等多种风味物质。</p>
            <p>🏆 <strong>权威背书：</strong>经第三方检测机构全方位检测，各项指标远超国家白酒标准。</p>
            <p>🍃 <strong>品鉴体验：</strong>入口绵柔，竹香清雅，诸味协调，回味悠长。</p>
            <h4 style="margin:24px 0 12px;color:var(--color-primary-dark);">【四大必买理由】</h4>
            <p>① 🌿 <strong>原料考究：</strong>武夷山全竹入酒 + 徂徕山竹溪古泉，天然原料基底。</p>
            <p>② 🔬 <strong>科技赋能：</strong>生物转化工艺，以竹叶黄酮(AOB)等成分入酒，风味层次分明。</p>
            <p>③ 🍃 <strong>极致体验：</strong>入口绵柔，竹香清雅，回味悠长。</p>
            <p>④ 🏆 <strong>品质承诺：</strong>第三方检测远超国标，晶莹剔透，竹香幽雅。</p>
            <h4 style="margin:24px 0 12px;color:var(--color-primary-dark);">【品鉴笔记】</h4>
            <p>外观：无色透明，挂杯均匀，酒花丰富细腻。</p>
            <p>香气：清雅馥郁，带有独特的竹香风格，层次分明。</p>
            <p>口感：入口绵柔，醇厚丰满，诸味协调，回味悠长。</p>
            <h4 style="margin:24px 0 12px;color:var(--color-primary-dark);">【适饮场景】</h4>
            <p>商务宴请：竹香清雅，宴请有品。</p>
            <p>高端礼赠："竹报平安"寓意吉祥，君子之礼，送得体面。</p>
            <p>老友小聚：一杯竹香，佐兴长谈。</p>
            <p style="text-align:center;margin-top:32px;color:var(--color-text-light);font-size:13px;">
                ⚠️ 过量饮酒有害健康 · 未成年人禁止饮酒 · 饮酒后请勿驾车 · 孕妇请勿饮酒
            </p>`;

            // 相关推荐(mock: 同系列过滤; live: 后端 related 4 条)
            document.getElementById('relatedProducts').innerHTML = (relatedArr || []).map(renderProductCard).join('');
        }

        // 初始渲染(mock 数据, 不白屏) + live SKU 异步替换(失败静默保持 mock)
        const mockRelated = PRODUCTS.filter(p => p.id !== product.id && (p.series === product.series || p.category === product.category)).slice(0, 4);
        renderAll(product, mockRelated);

        if (liveSku && window.ProductsLive) {
            ProductsLive.loadDetail(liveSku)
                .then(res => renderAll(res.product, res.related))
                .catch(err => console.warn('[ProductsLive] 详情 live 拉取失败, 保持 mock 渲染:', err && err.message));
        }


        // 75号·竹韵·智衡 知识内核联动(游客白名单 GET /api/zyh/knowledge)
        // 取工艺宪法 + 竹香香型两条事实锚点渲染; 后端不可达时静默降级(不阻断页面)
        (function loadZyhKnowledge() {
            const apiBase = localStorage.getItem('knowledgeDash.apiBase')
                || localStorage.getItem('aiLearningDash.apiBase')
                || 'http://localhost:8000';
            const WANT = ['craft_constitution', 'aroma_type', 'competitor_contrast'];
            fetch(apiBase + '/api/zyh/knowledge').then(r => r.ok ? r.json() : null)
                .then(d => {
                    const box = document.getElementById('zyhKnowledge');
                    if (!d || !Array.isArray(d.items) || !d.items.length) {
                        box.innerHTML = '<p style="color:var(--color-muted);font-size:13px;">'
                            + '知识内核暂不可达——可直接访问 <a href="zyh.html" '
                            + 'style="color:var(--color-primary,var(--color-primary-dark));">竹韵·智衡问答</a>。</p>';
                        return;
                    }
                    const items = WANT.map(id => d.items.find(it => it.id === id))
                        .filter(Boolean);
                    box.innerHTML = items.map(it => `
                        <div style="border:1px solid var(--color-border,#e4e9e6);border-radius:10px;
                            padding:16px 18px;margin-bottom:14px;">
                            <h4 style="margin:0 0 6px;color:var(--color-primary-dark,#24422f);">
                                🎋 ${it.title}</h4>
                            <p style="margin:0;font-size:14px;line-height:1.9;">${it.content}</p>
                            <div style="margin-top:8px;">
                                ${(it.citations || []).map(c =>
                                    `<span style="display:inline-block;font-size:11px;background:#eef4f0;
                                        color:#2f6b4f;border-radius:4px;padding:1px 8px;margin-right:4px;">
                                        ${c.type} · ${c.id}</span>`).join('')}
                            </div>
                        </div>`).join('');
                })
                .catch(() => { /* 静默降级——保持占位文案 */ });
        })();

        // 数量增减
        function changeQty(delta) {
            const input = document.getElementById('qtyInput');
            const val = Math.max(1, parseInt(input.value) + delta);
            input.value = val;
        }

        // 立即购买
        function buyNow(pid) {
            Cart.add(pid, parseInt(document.getElementById('qtyInput').value));
            setTimeout(() => location.href = 'cart.html', 500);
        }

        // 规格选择
        document.querySelectorAll('.spec-options .spec').forEach(s => {
            s.addEventListener('click', () => {
                document.querySelectorAll('.spec-options .spec').forEach(x => x.classList.remove('active'));
                s.classList.add('active');
            });
        });
    </script>
</body>
</html>
