<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#355c44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>网站新闻 - 竹香酒</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="page-banner">
        <div class="container">
            <h1>新闻动态</h1>
            <p>了解竹香酒最新资讯 · 品味品牌文化</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a><span>/</span>网站新闻
        </div>

        <!-- 新闻分类筛选 -->
        <div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;" id="newsCategories"></div>

        <!-- 新闻列表 -->
        <div class="news-list" id="newsList"></div>

        <!-- 分页（演示） -->
        <div style="text-align:center;padding:30px 0;">
            <button class="btn btn-outline" disabled>上一页</button>
            <span style="margin:0 16px;padding:8px 16px;background:var(--color-primary);color:#fff;border-radius:6px;">1</span>
            <button class="btn btn-outline" disabled>下一页</button>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        initPage('news');

        const categories = ['全部', '公司动态', '活动促销', '新品上市', '行业资讯', '品酒文化'];
        let currentCat = '全部';

        // 渲染分类
        document.getElementById('newsCategories').innerHTML = categories.map((c, i) => `
            <a href="#" class="btn ${i === 0 ? 'btn-primary' : 'btn-outline'}" data-cat="${c}" style="font-size:13px;padding:8px 20px;">${c}</a>`).join('');

        document.querySelectorAll('#newsCategories a').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('#newsCategories a').forEach(x => {
                    x.classList.remove('btn-primary');
                    x.classList.add('btn-outline');
                });
                a.classList.remove('btn-outline');
                a.classList.add('btn-primary');
                currentCat = a.dataset.cat;
                renderNews();
            });
        });

        // 渲染新闻列表
        function renderNews() {
            const list = currentCat === '全部' ? NEWS : NEWS.filter(n => n.category === currentCat);
            const html = list.map(n => `
                <div class="news-list-item" onclick="location.href='news-detail.html?id=${n.id}'">
                    <div class="news-img" data-icon="${n.icon}">
                        <span class="news-category">${n.category}</span>
                    </div>
                    <div class="news-info">
                        <div class="news-date">📅 ${n.date}</div>
                        <div class="news-title">${n.title}</div>
                        <div class="news-desc">${n.desc}</div>
                        <div class="news-meta">
                            <span>✍️ ${n.author}</span>
                            <span>👁 ${n.views} 阅读</span>
                            <span style="color:var(--color-primary);">阅读全文 →</span>
                        </div>
                    </div>
                </div>`).join('');
            document.getElementById('newsList').innerHTML = html || `
                <div style="background:#fff;border-radius:16px;padding:60px;text-align:center;color:var(--color-text-light);">
                    暂无该分类新闻 🌿
                </div>`;
        }

        renderNews();
    </script>
</body>
</html>
