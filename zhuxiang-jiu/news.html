<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#355c44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>网站新闻 - 竹香酒</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="page-banner">
        <div class="container">
            <h1>新闻动态</h1>
            <p>了解竹香酒最新资讯 · 品味品牌文化</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a><span>/</span>网站新闻
        </div>

        <!-- 新闻分类筛选（社区内容流加载成功后隐藏, 仅静态回落时生效） -->
        <div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;" id="newsCategories"></div>

        <!-- 品牌内容社区提示条（社区流渲染后显示） -->
        <div id="communityBadge" style="display:none;align-items:center;gap:8px;margin:20px 0;padding:10px 16px;background:#fff;border-radius:12px;color:var(--color-text-light);font-size:14px;">
            🌿 品牌内容社区 · 多平台发布内容实时同步
        </div>

        <!-- 新闻列表 -->
        <div class="news-list" id="newsList"></div>

        <!-- 分页（演示） -->
        <div style="text-align:center;padding:30px 0;">
            <button class="btn btn-outline" disabled>上一页</button>
            <span style="margin:0 16px;padding:8px 16px;background:var(--color-primary);color:#fff;border-radius:6px;">1</span>
            <button class="btn btn-outline" disabled>下一页</button>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        initPage('news');

        const categories = ['全部', '公司动态', '活动促销', '新品上市', '行业资讯', '品酒文化'];
        let currentCat = '全部';

        // 渲染分类
        document.getElementById('newsCategories').innerHTML = categories.map((c, i) => `
            <a href="#" class="btn ${i === 0 ? 'btn-primary' : 'btn-outline'}" data-cat="${c}" style="font-size:13px;padding:8px 20px;">${c}</a>`).join('');

        document.querySelectorAll('#newsCategories a').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('#newsCategories a').forEach(x => {
                    x.classList.remove('btn-primary');
                    x.classList.add('btn-outline');
                });
                a.classList.remove('btn-outline');
                a.classList.add('btn-primary');
                currentCat = a.dataset.cat;
                renderNews();
            });
        });

        // 渲染新闻列表
        function renderNews() {
            const list = currentCat === '全部' ? NEWS : NEWS.filter(n => n.category === currentCat);
            const html = list.map(n => `
                <div class="news-list-item" onclick="location.href='news-detail.html?id=${n.id}'">
                    <div class="news-img" data-icon="${n.icon}">
                        <span class="news-category">${n.category}</span>
                    </div>
                    <div class="news-info">
                        <div class="news-date">📅 ${n.date}</div>
                        <div class="news-title">${n.title}</div>
                        <div class="news-desc">${n.desc}</div>
                        <div class="news-meta">
                            <span>✍️ ${n.author}</span>
                            <span>👁 ${n.views} 阅读</span>
                            <span style="color:var(--color-primary);">阅读全文 →</span>
                        </div>
                    </div>
                </div>`).join('');
            document.getElementById('newsList').innerHTML = html || `
                <div style="background:#fff;border-radius:16px;padding:60px;text-align:center;color:var(--color-text-light);">
                    暂无该分类新闻 🌿
                </div>`;
        }

        renderNews();

        // ---------- 品牌内容社区（蓝图近期项③）----------
        // fetch 站内化内容 feed（sv73 多平台发布产物, 已发布态）动态渲染;
        // fail-soft: 接口失败/无内容时保留上方静态新闻回落, 页面不空白。
        (async function loadCommunityFeed() {
            let payload = null;
            try {
                const res = await fetch('/api/community/feed?page=1&page_size=20');
                if (res.ok) payload = await res.json();
            } catch (e) {
                payload = null; // 网络异常回落静态内容
            }
            const items = payload && payload.data && Array.isArray(payload.data.items)
                ? payload.data.items : [];
            if (!items.length) return; // 无内容: 保持静态渲染

            const PLATFORM_NAMES = {
                douyin: '抖音', xiaohongshu: '小红书', weibo: '微博',
                wechat_moments: '朋友圈', wechat_channels: '视频号',
                wechat_mp: '公众号'
            };
            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const fmtDate = iso => { try { return String(iso || '').slice(0, 10); } catch (e) { return ''; } };

            const html = items.map(it => {
                const platform = PLATFORM_NAMES[it.platform] || (it.platform || '内容');
                const tags = (it.hashtags || '').split(/[\s,，#]+/).filter(Boolean).slice(0, 5);
                const tagHtml = tags.length
                    ? `<div style="margin-top:6px;font-size:12px;color:var(--color-primary);">${tags.map(t => '#' + esc(t)).join(' ')}</div>` : '';
                const product = it.product;
                const productHtml = product
                    ? `<div style="display:flex;align-items:center;gap:12px;margin:10px 0;padding:10px 12px;background:rgba(53,92,68,.06);border:1px solid rgba(53,92,68,.15);border-radius:10px;">
                            <div style="flex:1;min-width:0;">
                                <div style="font-weight:600;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🍶 ${esc(product.name)}</div>
                                <div style="color:var(--color-primary);font-weight:700;">¥${esc(product.price)}</div>
                            </div>
                            <a class="btn btn-primary" style="font-size:13px;padding:8px 18px;flex-shrink:0;" href="product-detail.html?id=${encodeURIComponent(product.productId)}">去下单</a>
                        </div>` : '';
                return `
                <div class="news-list-item">
                    <div class="news-img" data-icon="🌿">
                        <span class="news-category">${esc(platform)}</span>
                    </div>
                    <div class="news-info">
                        <div class="news-date">📅 ${esc(fmtDate(it.publishedAt))}${it.shortCode ? ' · 短链 /r/' + esc(it.shortCode) : ''}</div>
                        <div class="news-title">${esc(it.title)}</div>
                        <div class="news-desc">${esc(it.bodySummary)}</div>
                        ${tagHtml}
                        ${productHtml}
                        <div class="news-meta">
                            <span>✍️ 品牌内容社区</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('newsList').innerHTML = html;
            document.getElementById('newsCategories').style.display = 'none';
            document.getElementById('communityBadge').style.display = 'flex';
        })();
    </script>
</body>
</html>
