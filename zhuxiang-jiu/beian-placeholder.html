<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹香酒官网 - 泰安市元禾生物科技有限公司</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(160deg, #f4f8f5 0%, #e8f0ea 60%, #dfeae2 100%);
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: #2f4838;
    }
    .card {
        background: #fff; border-radius: 16px; padding: 48px 56px;
        box-shadow: 0 8px 32px rgba(53, 92, 68, .12);
        text-align: center; max-width: 640px; width: calc(100% - 40px);
    }
    .logo { width: 84px; height: 84px; margin: 0 auto 20px;
            border-radius: 50%; background: linear-gradient(135deg, #355c44, #4a7c59);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 30px; font-weight: 600; letter-spacing: 2px; }
    h1 { font-size: 26px; margin-bottom: 10px; color: #2f4838; }
    .sub { font-size: 15px; color: #5a7a66; margin-bottom: 26px; }
    .desc { font-size: 14px; line-height: 1.9; color: #4a6355;
            text-align: left; background: #f6faf7; border-left:
            3px solid #4a7c59; padding: 14px 18px; border-radius: 6px; }
    .status { margin-top: 24px; font-size: 13px; color: #8aa594; }
    .badge { display: inline-block; padding: 4px 14px; border-radius: 20px;
             background: #eef5f0; color: #4a7c59; font-size: 12px;
             border: 1px solid #d5e6da; }
    footer { margin-top: 36px; padding-bottom: 28px; font-size: 12px;
             color: #9ab0a2; text-align: center; line-height: 2; }
    footer a { color: #7a9585; text-decoration: none; }
</style>
</head>
<body>
    <div class="card">
        <div class="logo">竹</div>
        <h1>竹香酒官网</h1>
        <div class="sub">泰安市元禾生物科技有限公司</div>
        <div class="desc">
            本网站为竹香型白酒品牌官方网站，提供企业介绍、
            竹香酒系列产品展示与品牌资讯。竹香酒遵循企业标准
            Q/SRQ 0001S-2023 酿造，入口绵甜、落口回甘。<br>
            理性饮酒，未成年人禁止饮酒。
        </div>
        <div class="status">
            <span class="badge">ICP备案已通过 · 鲁ICP备2026059492号-1</span>
        </div>
    </div>

        主办单位：泰安市元禾生物科技有限公司<br>
