<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="var(--color-primary-dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>购物车 - 竹香酒</title>
    <meta name="description" content="竹香酒官方商城购物车——已选翠竹酿造系列白酒清单管理、数量修改与优惠结算, 支持会员价与积分抵扣。">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="page-banner">
        <div class="container">
            <h1>🛒 我的购物车</h1>
            <p>竹奕佳酿 · 即刻带回家</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a><span>/</span>购物车
        </div>

        <div class="cart-layout" id="cartLayout"></div>
    </div>

    <div id="footer"></div>

    <script src="js/data.js?v=20261022a"></script>
    <script src="js/auth.js"></script>
    <script src="js/order-pricing.js"></script>
    <script src="js/main.js?v=20261021b"></script>
    <script>
        initPage('shop');

        // T1.3 计价预览 live 化: 登录走后端 POST /api/order/price/preview(真实会员价明细),
        // 游客/未登录走本地引擎(calculateOrderPrice 预估口径不变); 401/失败静默回落本地。
        // 后端契约(实测 2026-10-16):
        //   请求 {items:[{productId,quantity,unitPrice}],usePoints} + Authorization Bearer + X-Member-Id
        //   响应 priceDetail{goodsTotal,memberDiscount(负),couponDiscount,pointsDiscount,shippingFee,actualAmount,discountRate}

        function renderCart() {
            const items = Cart.get();
            const layout = document.getElementById('cartLayout');

            if (items.length === 0) {
                layout.innerHTML = `
                    <div style="background:var(--color-white);border-radius:16px;padding:80px 20px;text-align:center;box-shadow:var(--shadow-sm);">
                        <div style="font-size:80px;margin-bottom:20px;opacity:0.3;">🛒</div>
                        <h3 style="margin-bottom:12px;color:var(--color-text);">购物车还是空的</h3>
                        <p style="color:var(--color-text-light);margin-bottom:24px;">去看看竹奕佳酿，挑选您的心仪之选</p>
                        <a href="products.html" class="btn btn-primary btn-lg">去逛逛 →</a>
                    </div>`;
                return;
            }

            const rowsHtml = items.map(item => `
                <div class="cart-item">
                    <div></div>
                    <div class="cart-product">
                        <img src="" alt="${item.name}" onerror="this.style.background='linear-gradient(180deg,var(--color-primary-light),var(--color-primary-dark))'">
                        <div class="cart-product-info">
                            <h4>${item.name}</h4>
                            <p>竹奕酒 · 正品保证</p>
                        </div>
                    </div>
                    <div class="cart-price">¥${item.price}</div>
                    <div>
                        <div class="cart-qty">
                            <button onclick="updateItemQty('${item.id}', ${item.qty - 1})">−</button>
                            <input type="text" value="${item.qty}" readonly>
                            <button onclick="updateItemQty('${item.id}', ${item.qty + 1})">+</button>
                        </div>
                    </div>
                    <div class="cart-price">¥${item.price * item.qty}</div>
                    <div class="cart-remove" onclick="removeItem('${item.id}')" title="删除">✕</div>
                </div>`).join('');

            const totalQty = Cart.count();
            const totalPrice = Cart.total();

            layout.innerHTML = `
                <div class="cart-table">
                    <div class="cart-header">
                        <div></div>
                        <div>商品信息</div>
                        <div>单价</div>
                        <div>数量</div>
                        <div>小计</div>
                        <div>操作</div>
                    </div>
                    ${rowsHtml}
                </div>
                <div class="cart-footer">
                    <div>
                        <a href="products.html" style="color:var(--color-primary);font-size:14px;">← 继续购物</a>
                        <span style="margin-left:20px;color:var(--color-text-light);font-size:13px;cursor:pointer;" onclick="clearCart()">🗑 清空购物车</span>
                    </div>
                    <div class="cart-summary" id="cartSummary">
                        ${summaryLocalHtml(totalQty, totalPrice)}
                    </div>
                </div>`;

            // 登录态: 后端真实计价替换本地预估(失败静默保持)
            loadLivePricing(items, totalQty);
        }

        // ---------- 本地引擎(游客/回落, 预估口径与原实现一致) ----------
        function summaryLocalHtml(totalQty, totalPrice) {
            const mainProduct = Cart.get().length > 0
                ? { name: Cart.get()[0].name, price: Cart.get()[0].price }
                : { name: '竹香经典', price: 268 };
            const est = calculateOrderPrice({
                product: mainProduct,
                quantity: totalQty,
                orderType: 'retail',
                memberLevel: 'L5',
                points: 5000,
                couponValue: 0,
            });
            return `
                <div style="font-size:13px;color:var(--color-text-light);text-decoration:line-through;margin-bottom:4px;">
                    原价：¥${totalPrice.toFixed(2)}
                </div>
                <div style="font-size:13px;color:var(--color-primary);margin-bottom:4px;">
                    SVIP预估优惠：-¥${est.totalDiscount.toFixed(2)}
                </div>
                <div class="total">共 <strong style="color:var(--color-primary);">${totalQty}</strong> 件，预估实付：</div>
                <div class="total-price">¥${est.finalAmount.toFixed(2)}</div>
                <a href="checkout.html" class="btn btn-primary btn-lg">去结算 →</a>`;
        }

        // ---------- 后端真实计价(登录) ----------
        function summaryLiveHtml(pd, memberLevel, totalQty) {
            const amt = function (v) { return Math.abs(Number(v) || 0).toFixed(2); };
            return `
                <div style="font-size:13px;color:var(--color-text-light);margin-bottom:4px;">
                    商品合计：¥${Number(pd.goodsTotal || 0).toFixed(2)}
                </div>
                <div style="font-size:13px;color:var(--color-primary);margin-bottom:4px;">
                    会员优惠(Lv${memberLevel})：-¥${amt(pd.memberDiscount)}
                </div>
                <div style="font-size:13px;color:var(--color-primary);margin-bottom:4px;">
                    券抵扣：-¥${amt(pd.couponDiscount)} · 积分抵扣：-¥${amt(pd.pointsDiscount)}
                </div>
                <div style="font-size:13px;color:var(--color-text-light);margin-bottom:4px;">
                    运费：¥${Number(pd.shippingFee || 0).toFixed(2)}
                </div>
                <div class="total">共 <strong style="color:var(--color-primary);">${totalQty}</strong> 件，预估实付：</div>
                <div class="total-price">¥${Number(pd.actualAmount || 0).toFixed(2)}</div>
                <a href="checkout.html" class="btn btn-primary btn-lg">去结算 →</a>`;
        }

        function loadLivePricing(items, totalQty) {
            if (!(window.Auth && Auth.isLoggedIn())) return; // 游客: 保持本地预估
            const info = Auth.getInfo() || {};
            const token = Auth.getToken();
            if (!token || !info.memberId) return;
            fetch('/api/order/price/preview', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    'X-Member-Id': String(info.memberId)
                },
                body: JSON.stringify({
                    items: items.map(i => ({ productId: String(i.id), quantity: i.qty, unitPrice: i.price })),
                    usePoints: 0
                })
            }).then(r => r.ok ? r.json() : null).then(j => {
                if (!j || j.success !== true || !j.priceDetail) return; // 形态异常: 静默保持本地
                document.body.setAttribute('data-pricing-mode', 'live');
                const box = document.getElementById('cartSummary');
                if (box) box.innerHTML = summaryLiveHtml(j.priceDetail, j.memberLevel, totalQty);
            }).catch(err => console.warn('[CartPricing] live 计价失败, 保持本地预估:', err && err.message));
        }

        function updateItemQty(id, qty) {
            if (qty < 1) {
                if (confirm('确定要删除该商品吗？')) Cart.remove(id);
            } else {
                Cart.updateQty(id, qty);
            }
            renderCart();
        }

        function removeItem(id) {
            if (confirm('确定要删除该商品吗？')) {
                Cart.remove(id);
                renderCart();
            }
        }

        function clearCart() {
            if (confirm('确定要清空购物车吗？')) {
                Cart.clear();
                renderCart();
            }
        }

        renderCart();
    </script>
</body>
</html>
