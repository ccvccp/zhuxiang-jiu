<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="var(--color-primary-dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="竹香酒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>新闻详情 - 竹香酒</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="index.html">首页</a><span>/</span>
            <a href="news.html">网站新闻</a><span>/</span>
            <span id="crumbTitle">新闻详情</span>
        </div>

        <div class="news-article" id="newsArticle"></div>

        <!-- 上一篇/下一篇 -->
        <div style="background:var(--color-white);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;gap:20px;" id="prevNext"></div>

        <!-- 相关新闻 -->
        <section class="section">
            <div class="section-title">
                <h2>相关<span>推荐</span></h2>
                <div class="deco-line"></div>
            </div>
            <div class="news-grid" id="relatedNews"></div>
        </section>
    </div>

    <div id="footer"></div>

    <script src="js/data.js?v=20261021b"></script>
    <script src="js/products-live.js?v=20261021"></script>
    <script src="js/main.js?v=20261021b"></script>
    <script>
        initPage('news');

        // ============================================================
        // T1.4 双轨渲染(前端开发实施计划 批次一收官):
        //   ?post={postId} → 社区评测帖(live 轨)
        //   无 post 参      → data.js NEWS 静态轨(原逻辑原样保留回落)
        // 后端契约(实测 2026-10-17, 本地 8001):
        //   GET /api/community/posts?page=1&page_size=50 →
        //   {code:0, msg:"ok", data:{items:[{postId:int, memberId,
        //    nickname, targetType:"product"|"content", targetId, text,
        //    rating:1-5, status:"approved", createdAt:UTC-ISO,
        //    reviewedAt, operator}], page, pageSize, total, hasMore}}
        //   只显 approved(先审后显铁律); text 为单段长文, 前端按句
        //   切段对齐静态 content[] 版式(双模式同构红线)。
        // ============================================================
        (function () {
            // HTML 转义(后端文本入 DOM 前统一过闸, 对齐 products-live)
            function esc(v) {
                if (v === null || v === undefined) return '';
                return String(v)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            // UTC ISO → YYYY-MM-DD(与静态 NEWS.date 同构;
            // 直接截取不经 new Date, 规避 6 位微秒超长 ISO 兼容坑)
            function fmtDate(iso) { return (iso || '').slice(0, 10); }

            // ---------- 相关推荐·静态卡(静态轨/空态补齐共用原版式) ----------
            function staticCardHtml(n) {
                return `
            <div class="news-card" onclick="location.href='news-detail.html?id=${n.id}'">
                <div class="news-img" data-icon="${n.icon}">
                    <span class="news-category">${n.category}</span>
                </div>
                <div class="news-info">
                    <div class="news-date">📅 ${n.date} · 👁 ${n.views}</div>
                    <div class="news-title">${n.title}</div>
                    <div class="news-desc">${n.desc}</div>
                </div>
            </div>`;
            }

            // ---------- 静态轨(data.js NEWS, 原逻辑原样) ----------
            function renderStatic() {
                document.body.setAttribute('data-community-mode', 'mock');

                const newsId = parseInt(getQueryParam('id')) || 1;
                const news = NEWS.find(n => n.id === newsId) || NEWS[0];
                const idx = NEWS.findIndex(n => n.id === news.id);
                const prev = idx > 0 ? NEWS[idx - 1] : null;
                const next = idx < NEWS.length - 1 ? NEWS[idx + 1] : null;

                document.getElementById('crumbTitle').textContent = news.category;
                document.title = `${news.title} - 竹香酒`;

                // 渲染新闻正文
                const contentHtml = news.content.map(p => `<p>${p}</p>`).join('');
                document.getElementById('newsArticle').innerHTML = `
            <div class="news-article-content">
                <h1>${news.title}</h1>
                <div class="news-article-meta">
                    <span>📅 ${news.date}</span>
                    <span>✍️ ${news.author}</span>
                    <span>📁 ${news.category}</span>
                    <span>👁 ${news.views} 阅读</span>
                </div>
                <div style="height:240px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary-dark));border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;font-size:80px;color:rgba(255,255,255,0.6);">
                    ${news.icon}
                </div>
                ${contentHtml}
                <div style="background:var(--color-bg);padding:20px;border-radius:8px;margin-top:30px;border-left:4px solid var(--color-primary);">
                    <p style="margin:0;color:var(--color-text-light);font-size:13px;">
                        🌿 山东瑞麒酒业 · 全竹发酵 · 竹酒首创<br>
                        如需了解更多产品信息，请<a href="products.html" style="color:var(--color-primary);font-weight:bold;">点击这里</a>浏览竹奕全系产品。
                    </p>
                </div>
                <div class="news-article-footer">
                    <span style="color:var(--color-text-light);font-size:13px;">声明：本文为山东瑞麒酒业原创内容，转载请注明出处。</span>
                    <div>
                        <a href="#" style="color:var(--color-text-light);margin-right:16px;">💬 分享</a>
                        <a href="service.html" style="color:var(--color-primary);">联系客服 →</a>
                    </div>
                </div>
            </div>`;

                // 上一篇/下一篇
                document.getElementById('prevNext').innerHTML = `
            <div style="flex:1;">
                ${prev ? `<div style="font-size:12px;color:var(--color-text-light);margin-bottom:4px;">上一篇</div>
                <a href="news-detail.html?id=${prev.id}" style="font-size:14px;">${prev.title}</a>` : '<span style="color:var(--color-text-light);font-size:13px;">已经是第一篇了</span>'}
            </div>
            <div style="flex:1;text-align:right;">
                ${next ? `<div style="font-size:12px;color:var(--color-text-light);margin-bottom:4px;">下一篇</div>
                <a href="news-detail.html?id=${next.id}" style="font-size:14px;">${next.title}</a>` : '<span style="color:var(--color-text-light);font-size:13px;">已经是最后一篇了</span>'}
            </div>`;

                // 相关新闻（取其他新闻中前3条）
                const related = NEWS.filter(n => n.id !== news.id).slice(0, 3);
                document.getElementById('relatedNews').innerHTML = related.map(staticCardHtml).join('');
            }

            // ---------- 404/不可达 空态(计划要求: 帖子不存在→404 空态文案) ----------
            function renderNotFound(msg, sub) {
                document.body.setAttribute('data-community-mode', 'notfound');
                document.getElementById('crumbTitle').textContent = '内容不存在';
                document.getElementById('newsArticle').innerHTML = `
            <div class="news-article-content" style="text-align:center;padding:56px 24px;">
                <div style="font-size:64px;line-height:1;margin-bottom:16px;">🍶</div>
                <h1 style="font-size:20px;margin:0 0 8px;">${esc(msg)}</h1>
                <p style="color:var(--color-text-light);font-size:14px;margin:0 0 24px;">${esc(sub)}</p>
                <div>
                    <a href="news.html" style="display:inline-block;background:var(--color-primary);color:var(--color-white);padding:10px 24px;border-radius:20px;font-size:14px;margin:0 6px;">返回新闻列表</a>
                    <a href="products.html" style="display:inline-block;border:1px solid var(--color-primary);color:var(--color-primary);padding:10px 24px;border-radius:20px;font-size:14px;margin:0 6px;">去逛逛产品</a>
                </div>
            </div>`;
                document.getElementById('prevNext').style.display = 'none';
                document.getElementById('relatedNews').innerHTML = NEWS.slice(0, 3).map(staticCardHtml).join('');
            }

            // ---------- live 轨: 评测帖正文 + 溯源(发布时间/审核/关联商品) ----------
            function renderLiveArticle(post, items) {
                document.body.setAttribute('data-community-mode', 'live');
                const idx = items.indexOf(post);
                const prev = idx > 0 ? items[idx - 1] : null;
                const next = idx < items.length - 1 ? items[idx + 1] : null;

                document.getElementById('crumbTitle').textContent = '会员评测';
                document.title = `${esc(post.nickname)} 的酒友评测 - 竹香酒`;

                // 单段长文按句切段 → 对齐静态 content[] 多段版式
                const paras = (post.text || '').match(/[^。！？!?]+[。！？!?]?/g) || [post.text || ''];
                const contentHtml = paras.map(p => `<p>${esc(p.trim())}</p>`).join('');
                const ratingTxt = post.rating ? `★ ${esc(post.rating)} 评分` : '社区评测';

                document.getElementById('newsArticle').innerHTML = `
            <div class="news-article-content">
                <h1>${esc(post.nickname)} 的酒友评测</h1>
                <div class="news-article-meta">
                    <span>📅 ${esc(fmtDate(post.createdAt))}</span>
                    <span>✍️ ${esc(post.nickname)}</span>
                    <span>📁 会员评测</span>
                    <span>👁 ${ratingTxt}</span>
                </div>
                <div style="height:240px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary-dark));border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;font-size:80px;color:rgba(255,255,255,0.6);">
                    🍶
                </div>
                ${contentHtml}
                <div style="background:var(--color-bg);padding:20px;border-radius:8px;margin-top:30px;border-left:4px solid var(--color-primary);">
                    <p style="margin:0;color:var(--color-text-light);font-size:13px;">
                        🌿 会员实名评测 · 经平台审核后发布（审核员：${esc(post.operator || 'admin')}）<br>
                        发布时间：${esc(fmtDate(post.createdAt))} · 关联商品：<a id="traceProductLink" href="product-detail.html?id=${esc(post.targetId)}" style="color:var(--color-primary);font-weight:bold;">点击查看</a>
                    </p>
                </div>
                <div class="news-article-footer">
                    <span style="color:var(--color-text-light);font-size:13px;">声明：本文为会员评测内容，观点仅供参考，不代表品牌官方立场。</span>
                    <div>
                        <a href="#" style="color:var(--color-text-light);margin-right:16px;">💬 分享</a>
                        <a href="service.html" style="color:var(--color-primary);">联系客服 →</a>
                    </div>
                </div>
            </div>`;

                // 溯源·关联商品名增强(best-effort): 失败保持"点击查看", 不编造占位
                if (window.ProductsLive && post.targetType === 'product') {
                    ProductsLive.loadDetail(post.targetId).then(res => {
                        const a = document.getElementById('traceProductLink');
                        if (a && res && res.product) a.textContent = res.product.name;
                    }).catch(() => { /* 保持兜底文案 */ });
                }

                // 上一篇/下一篇(同列表相邻帖, 版式同构)
                document.getElementById('prevNext').innerHTML = `
            <div style="flex:1;">
                ${prev ? `<div style="font-size:12px;color:var(--color-text-light);margin-bottom:4px;">上一篇</div>
                <a href="news-detail.html?post=${esc(prev.postId)}" style="font-size:14px;">${esc(prev.nickname)} 的酒友评测</a>` : '<span style="color:var(--color-text-light);font-size:13px;">已经是第一篇了</span>'}
            </div>
            <div style="flex:1;text-align:right;">
                ${next ? `<div style="font-size:12px;color:var(--color-text-light);margin-bottom:4px;">下一篇</div>
                <a href="news-detail.html?post=${esc(next.postId)}" style="font-size:14px;">${esc(next.nickname)} 的酒友评测</a>` : '<span style="color:var(--color-text-light);font-size:13px;">已经是最后一篇了</span>'}
            </div>`;

                // 相关推荐: 其余评测帖前3; 不足3张以静态 NEWS 补齐(三卡版式同构)
                const others = items.filter(x => x !== post).slice(0, 3);
                let liveCards = others.map(x => {
                    const d = (x.text || '').slice(0, 42);
                    const more = (x.text || '').length > 42 ? '…' : '';
                    return `
            <div class="news-card" onclick="location.href='news-detail.html?post=${esc(x.postId)}'">
                <div class="news-img" data-icon="🍶">
                    <span class="news-category">会员评测</span>
                </div>
                <div class="news-info">
                    <div class="news-date">📅 ${esc(fmtDate(x.createdAt))} · ${x.rating ? '★ ' + esc(x.rating) : '👤 会员'}</div>
                    <div class="news-title">${esc(x.nickname)} 的酒友评测</div>
                    <div class="news-desc">${esc(d)}${more}</div>
                </div>
            </div>`;
                }).join('');
                if (others.length < 3) {
                    liveCards += NEWS.slice(0, 3 - others.length).map(staticCardHtml).join('');
                }
                document.getElementById('relatedNews').innerHTML = liveCards;
            }

            // ---------- live 轨入口: 拉公开列表后按 postId 定位 ----------
            function renderLive(rawId) {
                const ctl = ('AbortController' in window) ? new AbortController() : null;
                const timer = ctl ? setTimeout(() => { ctl.abort(); }, 10000) : null;
                fetch('/api/community/posts?page=1&page_size=50', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: ctl ? ctl.signal : undefined
                }).then(r => {
                    if (timer) clearTimeout(timer);
                    if (!r.ok) throw new Error('http_' + r.status);
                    return r.json();
                }).then(j => {
                    const items = (j && j.code === 0 && j.data && Array.isArray(j.data.items)) ? j.data.items : null;
                    if (!items) throw new Error('shape');
                    const post = items.find(x => String(x.postId) === String(rawId));
                    if (!post) {
                        renderNotFound('该内容不存在或已下架', '可能已被作者删除或未通过平台审核');
                        return;
                    }
                    renderLiveArticle(post, items);
                }).catch(err => {
                    if (timer) clearTimeout(timer);
                    renderNotFound('内容暂时无法加载', '网络异常或服务不可用，请稍后再试');
                    console.warn('[community] live 拉取失败:', err && err.message);
                });
            }

            // ---------- 双轨分发 ----------
            const rawPost = getQueryParam('post');
            if (rawPost) renderLive(rawPost);
            else renderStatic();
        })();
    </script>
</body>
</html>
